[project]
name = "ai-nexus-assistant"
version = "4.5.5"
description = "AI增强个人科研助手 — 整合文献检索、试验管理、知识库、AI对话"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "SQLAlchemy>=2.0,<3",
    "openai>=1.0,<3",
    "anthropic>=0.34,<1",
    "httpx>=0.27,<1",
    "requests>=2.28,<3",
    "scholarly>=1.7,<2",
    "arxiv>=2.0,<3",
    "PyMuPDF>=1.23,<2",
    "python-docx>=1.1,<2",
    "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
tauri = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "python-multipart>=0.0.9,<1",
]
desktop = [
    "PySide6>=6.7,<7",
    "Pillow>=10,<13",
    "pystray>=0.19,<1",
    "openpyxl>=3.1,<4",
    "matplotlib>=3.7,<4",
    "scipy>=1.10,<2",
]
build = [
    "PyInstaller>=6.10,<7",
]
test = [
    "pytest>=8,<9",
    "pytest-cov>=5,<7",
]
full = [
    "numpy>=1.26,<3",
    "faiss-cpu>=1.8,<2",
    "sentence-transformers>=3,<6",
    "bertopic>=0.16,<1",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[project.scripts]
nexus = "app.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
