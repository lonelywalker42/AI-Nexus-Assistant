[project]
name = "ai-nexus-assistant"
version = "0.1.0"
description = "AI增强个人科研助手 — 整合文献检索、试验管理、知识库、AI对话"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.7.0",
    "SQLAlchemy>=2.0",
    "openai>=1.0",
    "requests>=2.28",
    "scholarly>=1.7",
    "arxiv>=2.0",
    "Pillow>=10.0",
    "pystray>=0.19",
    "openpyxl>=3.1",
    "PyMuPDF>=1.23",
    "matplotlib>=3.7",
    "scipy>=1.10",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
full = [
    "chromadb>=0.4.0",
    "sentence-transformers>=2.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project.scripts]
nexus = "main:main"
