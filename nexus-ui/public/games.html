  handleRightClick(e) {
    if (this.over || this.won || this.showHelp) return;
    const rect = canvas.getBoundingClientRect();
    const mx = (e.clientX - rect.left) * (W / rect.width);
    const my = (e.clientY - rect.top) * (H / rect.height);
    const c = Math.floor((mx - this.ox) / this.cellSize);
    const r = Math.floor((my - this.oy) / this.cellSize);
    if (r < 0 || r >= this.rows || c < 0 || c >= this.cols) return;
    if (!this.revealed[r][c]) this.flagged[r][c] = !this.flagged[r][c];
  }

  handleKey(e) {
    if (this.showHelp) {
      if (e.key === 'Escape') { backToMenu(); return; }
      if (e.key === 'd' || e.key === 'D') {
        const keys = Object.keys(this.difficulties);
        const idx = (keys.indexOf(this.difficulty) + 1) % keys.length;
        this.difficulty = keys[idx];
        this.applyDifficulty();
        // Reinitialize grid arrays to match new dimensions
        this.grid = Array.from({ length: this.rows }, () => Array(this.cols).fill(0));
        this.revealed = Array.from({ length: this.rows }, () => Array(this.cols).fill(false));
        this.flagged = Array.from({ length: this.rows }, () => Array(this.cols).fill(false));
        this.score = 0; this.over = false; this.won = false;
        this.firstClick = true; this.startTime = 0; this.elapsed = 0;
        this.drawHelp();
        return;
      }
      // Any other key dismisses help and starts the game
      this.showHelp = false;
      if (this._helpRaf) cancelAnimationFrame(this._helpRaf);
      this._helpRaf = null;
      this.loop();
      return;
    }
    if (this.over || this.won) {
      if (e.key === 'r') { this.destroy(); gameInstance = new GameMinesweeper(); gameInstance.init(); return; }
      if (e.key === 'h' || e.key === 'H') { showHighScores('minesweeper'); return; }
      if (e.key === 'Escape') { backToMenu(); return; }
      return;
    }
    if (e.key === 'Escape') { backToMenu(); return; }
  }

  loop() {
    if (!this.showHelp) {
      // Game mode
      if (this._helpRaf) { cancelAnimationFrame(this._helpRaf); this._helpRaf = null; }
      if (this._raf) cancelAnimationFrame(this._raf);
      this.draw();
      this._raf = requestAnimationFrame(() => this.loop());
      return;
    }
    // Help mode — but double-check in case showHelp was just set to false
    if (!this.showHelp) return;
    this.drawHelp();
    this._helpRaf = requestAnimationFrame(() => this.loop());
  }

  drawHelp() {
    if (!this.showHelp) return; // guard: don't draw help if we just exited
    ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center';
    ctx.fillStyle = C.green; ctx.font = '24px Consolas, monospace';
    ctx.shadowColor = C.green; ctx.shadowBlur = 12;
    ctx.fillText('M I N E S W E E P E R', W/2, 100); ctx.shadowBlur = 0;
    ctx.fillStyle = C.amber; ctx.font = '14px Consolas, monospace';
    ctx.fillText('CLEAR THE FIELD', W/2, 140);
    const d = this.difficulties[this.difficulty];
    const diffLabel = this.difficulty.toUpperCase() + ': ' + d.cols + 'x' + d.rows + ', ' + d.mines + ' mines';
    ctx.fillStyle = C.cyan; ctx.font = '13px Consolas, monospace';
    ctx.fillText('[ ' + diffLabel + ' ]', W/2, 165);
    const lines = [
      ['Left Click', 'Reveal cell'],
      ['Right Click', 'Flag/unflag mine'],
      ['', ''],
      ['Numbers show', 'adjacent mines'],
      ['Reveal all safe', 'cells to win'],
      ['', ''],
      ['D key', 'Cycle difficulty'],
    ];
    ctx.textAlign = 'left'; let ly = 195;
    lines.forEach(l => {
      if (l[0] && l[1]) { ctx.fillStyle = C.cyan; ctx.font = '13px Consolas, monospace'; ctx.fillText(l[0], W/2-100, ly); ctx.fillStyle = C.white; ctx.fillText(l[1], W/2+20, ly); }
      ly += 28;
    });
    ctx.textAlign = 'center'; ctx.fillStyle = C.amber; ctx.font = '14px Consolas, monospace';
    if (Math.floor(Date.now()/600)%2===0) ctx.fillText('Press any key to start...', W/2, H-60);
  }

  draw() {
    ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, H);
    // Title
    ctx.fillStyle = C.green; ctx.font = '16px Consolas, monospace'; ctx.textAlign = 'center';
    ctx.fillText('M I N E S W E E P E R', W/2, 25);
    // Stats
    ctx.fillStyle = C.amber; ctx.font = '12px Consolas, monospace'; ctx.textAlign = 'left';
    const flags = this.flagged.flat().filter(Boolean).length;
    ctx.fillText('MINES: ' + (this.mines - flags), 20, 50);
    ctx.fillStyle = C.cyan; ctx.textAlign = 'center';
    const elapsed = this.startTime > 0 ? Math.floor((performance.now() - this.startTime) / 1000) : 0;
    ctx.fillText(String(elapsed).padStart(3, '0') + 's', W/2, 50);
    ctx.fillStyle = C.green; ctx.textAlign = 'right';
    ctx.fillText('SCORE: ' + this.score, W-20, 50);
    // Grid
    const cs = this.cellSize;
    const numColors = ['', C.cyan, C.green, C.red, C.blue, C.amber, C.magenta, C.white, C.dim];
    for (let r = 0; r < this.rows; r++) for (let c = 0; c < this.cols; c++) {
      const x = this.ox + c * cs, y = this.oy + r * cs;
      if (this.revealed[r][c]) {
        ctx.fillStyle = '#1a1a2a'; ctx.fillRect(x, y, cs, cs);
        const v = this.grid[r][c];
        if (v === -1) {
          ctx.fillStyle = C.red; ctx.font = (cs - 4) + 'px Consolas'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
          ctx.fillText('✦', x + cs/2, y + cs/2);
        } else if (v > 0) {
          ctx.fillStyle = numColors[v] || C.white;
          ctx.font = 'bold ' + (cs - 6) + 'px Consolas'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
          ctx.fillText(v, x + cs/2, y + cs/2);
        }
      } else {
        ctx.fillStyle = '#2a2a3a'; ctx.fillRect(x, y, cs, cs);
        ctx.strokeStyle = '#3a3a4a'; ctx.lineWidth = 0.5; ctx.strokeRect(x, y, cs, cs);
        if (this.flagged[r][c]) {
          ctx.fillStyle = C.amber; ctx.font = (cs - 6) + 'px Consolas'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
          ctx.fillText('⚑', x + cs/2, y + cs/2);
        }
      }
    }
    // Game over / Won
    if (this.over || this.won) {
      ctx.fillStyle = 'rgba(0,0,0,0.7)'; ctx.fillRect(0, 0, W, H);
      ctx.textAlign = 'center';
      ctx.fillStyle = this.won ? C.green : C.red;
      ctx.font = '28px Consolas, monospace'; ctx.fillText(this.won ? 'YOU WIN!' : 'GAME OVER', W/2, H/2 - 30);
      ctx.fillStyle = C.amber; ctx.font = '14px Consolas, monospace';
      ctx.fillText('Score: ' + this.score + '  Time: ' + Math.floor(elapsed) + 's', W/2, H/2);
      // Clickable retry button
      const btnX = W/2-80, btnY = H/2+10, btnW = 160, btnH = 40;
      ctx.strokeStyle = C.amber; ctx.lineWidth = 2; ctx.strokeRect(btnX, btnY, btnW, btnH);
      ctx.fillStyle = 'rgba(255,176,0,0.1)'; ctx.fillRect(btnX+1, btnY+1, btnW-2, btnH-2);
      ctx.fillStyle = C.amber; ctx.font = '16px Consolas, monospace';
      ctx.fillText('[ RESTART ]', W/2, btnY + 26);
      ctx.fillStyle = C.dim; ctx.font = '10px Consolas, monospace';
      ctx.fillText('Click button or press R · ESC menu · H scores', W/2, H/2 + 70);
    }
  }
}

// ══════════════════════════════════════════════
//  FLAPPY — Flappy bird clone
// ══════════════════════════════════════════════
class GameFlappy {
  constructor() {
    this.birdY = H / 2; this.birdV = 0; this.birdX = 80;
    this.gravity = 0.4; this.jumpForce = -7;
    this.pipes = []; this.score = 0; this.over = false;
    this.pipeTimer = 0; this.pipeInterval = 250;
    this.gap = 160; this.pipeW = 50;
    this.showHelp = true;
    this.stars = Array.from({ length: 40 }, () => ({ x: Math.random() * W, y: Math.random() * H, s: Math.random() * 1.5 + 0.5 }));
  }

  init(savedState) {
    if (savedState) {
      this.score = savedState.score; this.over = savedState.over || false;
      this.showHelp = false;
    } else {
      this.score = 0; this.over = false; this.showHelp = true;
    }
    this.birdY = H / 2; this.birdV = 0;
    this.pipes = []; this.pipeTimer = 0;
    this._keyD = (e) => this.keyDown(e);
    this._clickH = () => this.flap();
    document.addEventListener('keydown', this._keyD);
    canvas.addEventListener('click', this._clickH);
    this.lastTime = performance.now();
    this.loop();
  }

  saveProgress() {
    saveGameProgress('flappy', { score: this.score, over: this.over });
  }

  destroy() {
    document.removeEventListener('keydown', this._keyD);
    canvas.removeEventListener('click', this._clickH);
    if (this._raf) cancelAnimationFrame(this._raf);
    if (this._helpRaf) cancelAnimationFrame(this._helpRaf);
  }

  flap() {
    if (this.showHelp) { this.showHelp = false; this.lastTime = performance.now(); this.loop(); return; }
    if (this.over) return;
    this.birdV = this.jumpForce;
  }

  keyDown(e) {
    if (this.showHelp) {
      if (e.key === 'Escape') { backToMenu(); return; }
      this.showHelp = false; this.lastTime = performance.now(); this.loop(); return;
    }
    if (this.over) {
      if (e.key === 'r') { this.destroy(); gameInstance = new GameFlappy(); gameInstance.init(); return; }
      if (e.key === 'h' || e.key === 'H') { showHighScores('flappy'); return; }
      if (e.key === 'Escape') { backToMenu(); return; }
      return;
    }
    if (e.key === 'Escape') { backToMenu(); return; }
    if (e.key === ' ' || e.key === 'ArrowUp') { e.preventDefault(); this.flap(); }
  }

  loop() {
    if (this.over) { this.draw(); return; }
    if (!this.showHelp) {
      if (this._helpRaf) { cancelAnimationFrame(this._helpRaf); this._helpRaf = null; }
      const now = performance.now(); const dt = Math.min((now - this.lastTime) / 1000, 0.05); this.lastTime = now;
      this.update(dt); this.draw();
      this._raf = requestAnimationFrame(() => this.loop());
      return;
    }
    if (!this.showHelp) return;
    this.drawHelp();
    this._helpRaf = requestAnimationFrame(() => this.loop());
  }

  update(dt) {
    // Bird physics
    this.birdV += this.gravity;
    this.birdY += this.birdV;
    // Stars
    this.stars.forEach(s => { s.x = (s.x - 30 * dt + W) % W; });
    // Pipes
    this.pipeTimer++;
    if (this.pipeTimer >= this.pipeInterval) {
      this.pipeTimer = 0;
      const gapY = 80 + Math.random() * (H - 260 - this.gap);
      this.pipes.push({ x: W, gapY, scored: false });
    }
    this.pipes.forEach(p => p.x -= 100 * dt);
    this.pipes = this.pipes.filter(p => p.x > -this.pipeW - 10);
    // Scoring
    this.pipes.forEach(p => {
      if (!p.scored && p.x + this.pipeW < this.birdX) {
        p.scored = true; this.score++;
      }
    });
    // Collision
    const birdR = 12;
    if (this.birdY - birdR < 0 || this.birdY + birdR > H) {
      this.over = true;
      saveHighScore('flappy', this.score, {});
      clearGameProgress('flappy');
      return;
    }
    this.pipes.forEach(p => {
      if (this.birdX + birdR > p.x && this.birdX - birdR < p.x + this.pipeW) {
        if (this.birdY - birdR < p.gapY || this.birdY + birdR > p.gapY + this.gap) {
          this.over = true;
          saveHighScore('flappy', this.score, {});
          clearGameProgress('flappy');
        }
      }
    });
  }

  drawHelp() {
    ctx.fillStyle = '#06060e'; ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center';
    ctx.fillStyle = C.green; ctx.font = '28px Consolas, monospace';
    ctx.shadowColor = C.green; ctx.shadowBlur = 12;
    ctx.fillText('F L A P P Y', W/2, 100); ctx.shadowBlur = 0;
    ctx.fillStyle = C.amber; ctx.font = '14px Consolas, monospace';
    ctx.fillText('FLY THROUGH PIPES', W/2, 140);
    const lines = [
      ['SPACE / ↑ / Click', 'Flap (jump)'],
      ['', ''],
      ['Navigate through', 'the pipe gaps'],
      ['Each pipe passed', '= +1 score'],
      ['', ''],
      ['Don\'t hit pipes', 'or the ground!'],
    ];
    ctx.textAlign = 'left'; let ly = 180;
    lines.forEach(l => {
      if (l[0] && l[1]) { ctx.fillStyle = C.cyan; ctx.font = '13px Consolas, monospace'; ctx.fillText(l[0], W/2-120, ly); ctx.fillStyle = C.white; ctx.fillText(l[1], W/2+20, ly); }
      ly += 28;
    });
    ctx.textAlign = 'center'; ctx.fillStyle = C.amber; ctx.font = '14px Consolas, monospace';
    if (Math.floor(Date.now()/600)%2===0) ctx.fillText('Press SPACE or click to start...', W/2, H-60);
  }

  draw() {
    ctx.fillStyle = '#06060e'; ctx.fillRect(0, 0, W, H);
    // Stars
    this.stars.forEach(s => { ctx.fillStyle = `rgba(255,255,255,${s.s/2})`; ctx.fillRect(s.x, s.y, s.s, s.s); });
    // Pipes
    this.pipes.forEach(p => {
      ctx.fillStyle = '#1a5c1a';
      ctx.fillRect(p.x, 0, this.pipeW, p.gapY);
      ctx.fillRect(p.x, p.gapY + this.gap, this.pipeW, H - p.gapY - this.gap);
      // Pipe caps
      ctx.fillStyle = '#2a8c2a';
      ctx.fillRect(p.x - 3, p.gapY - 20, this.pipeW + 6, 20);
      ctx.fillRect(p.x - 3, p.gapY + this.gap, this.pipeW + 6, 20);
    });
    // Bird
    ctx.save();
    ctx.translate(this.birdX, this.birdY);
    ctx.rotate(Math.min(Math.max(this.birdV * 3, -30), 60) * Math.PI / 180);
    // Body
    ctx.fillStyle = C.yellow;
    ctx.beginPath(); ctx.arc(0, 0, 12, 0, Math.PI * 2); ctx.fill();
    // Eye
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(5, -3, 4, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#000';
    ctx.beginPath(); ctx.arc(6, -3, 2, 0, Math.PI * 2); ctx.fill();
    // Beak
    ctx.fillStyle = C.amber;
    ctx.beginPath(); ctx.moveTo(10, 0); ctx.lineTo(18, 2); ctx.lineTo(10, 5); ctx.closePath(); ctx.fill();
    ctx.restore();
    // Score
    ctx.fillStyle = C.amber; ctx.font = '20px Consolas, monospace'; ctx.textAlign = 'center';
    ctx.fillText(this.score, W/2, 45);
    // Game over
    if (this.over) {
      ctx.fillStyle = 'rgba(0,0,0,0.7)'; ctx.fillRect(0, 0, W, H);
      ctx.textAlign = 'center';
      ctx.fillStyle = C.red; ctx.font = '28px Consolas, monospace'; ctx.fillText('GAME OVER', W/2, H/2 - 40);
      ctx.fillStyle = C.amber; ctx.font = '18px Consolas, monospace'; ctx.fillText('Score: ' + this.score, W/2, H/2 - 10);
      const hi = getHighScore('flappy');
      if (hi > 0) { ctx.fillStyle = C.yellow; ctx.font = '12px Consolas, monospace'; ctx.fillText('BEST: ' + hi, W/2, H/2 + 15); }
      ctx.fillStyle = C.dim; ctx.font = '12px Consolas, monospace'; ctx.fillText('R restart · ESC menu · H scores', W/2, H/2 + 45);
    }
  }
}

// ══════════════════════════════════════════════
//  PAC-MAN — Classic maze chase
// ══════════════════════════════════════════════
class GamePacman {
  constructor() {
    this.cellSize = 18;
    this.cols = 25; this.rows = 27;
    this.ox = (W - this.cols * this.cellSize) / 2;
    this.oy = 40;
    this.map = [];
    this.pacman = { x: 12, y: 20, dir: { x: 0, y: 0 }, nextDir: { x: 0, y: 0 }, mouth: 0, mouthDir: 1 };
    this.ghosts = [];
    this.dots = 0; this.score = 0; this.lives = 3; this.over = false;
    this.showHelp = true; this.moveTimer = 0; this.moveSpeed = 120;
    this.ghostTimer = 0; this.powered = 0; this.powerTimer = 0;
  }

  initMap() {
    // 0=path+dot, 1=wall, 2=path no dot, 3=power pellet, 4=ghost house
    const raw = [
      '1111111111111111111111111',
      '1000000000001100000000001',
      '1011101111101101111011101',
      '1311101111101101111011131',
      '1011101111101101111011101',
      '1000000000000000000000001',
      '1011101101111111011011101',
      '1011101101111111011011101',
      '1000001100001100001100001',
      '1111101111121101111111101',
      '1111101111121101111111101',
      '1111101122222222221111101',
      '1111101121111111121111101',
      '2222202221444441222222222',
      '1111101121111111121111101',
      '1111101122222222221111101',
      '1111101121111111121111101',
      '1111101121111111121111101',
      '1000000000001100000000001',
      '1011101111101101111011101',
      '1301100000002200000011031',
      '1101101101111111011011001',
      '1101101101111111011011001',
      '1000001100001100001100001',
      '1011111111101101111111101',
      '1000000000000000000000001',
      '1111111111111111111111111',
    ];
    this.map = raw.map(row => row.split('').map(Number));
    this.dots = 0;
    for (let r = 0; r < this.rows; r++) for (let c = 0; c < this.cols; c++) {
      if (this.map[r][c] === 0) this.dots++;
    }
  }

  init(savedState) {
    if (savedState) {
      this.score = savedState.score; this.lives = savedState.lives;
      this.over = savedState.over || false; this.showHelp = false;
      this.map = savedState.map; this.dots = savedState.dots;
      this.pacman = savedState.pacman;
      this.ghosts = savedState.ghosts;
    } else {
      this.score = 0; this.lives = 3; this.over = false; this.showHelp = true;
      this.initMap();
      this.pacman = { x: 12, y: 20, dir: { x: 0, y: 0 }, nextDir: { x: 0, y: 0 }, mouth: 0, mouthDir: 1 };
      this.ghosts = [
        { x: 11, y: 13, dir: { x: 1, y: 0 }, color: '#ff0000' },
        { x: 12, y: 13, dir: { x: 0, y: -1 }, color: '#ffb8ff' },
        { x: 13, y: 13, dir: { x: -1, y: 0 }, color: '#00ffff' },
        { x: 14, y: 13, dir: { x: 0, y: 1 }, color: '#ffb852' },
      ];
    }
    this.powered = 0;
    this._keyD = (e) => this.key(e);
    document.addEventListener('keydown', this._keyD);
    this.lastTime = performance.now();
    this.loop();
  }

  saveProgress() {
    saveGameProgress('pacman', {
      score: this.score, lives: this.lives, map: this.map, dots: this.dots,
      pacman: this.pacman, ghosts: this.ghosts, over: this.over
    });
  }

  destroy() { document.removeEventListener('keydown', this._keyD); if (this._raf) cancelAnimationFrame(this._raf); if (this._helpRaf) cancelAnimationFrame(this._helpRaf); }

  key(e) {
    if (e.key === 'Escape') { backToMenu(); return; }
    if (this.showHelp) { this.showHelp = false; if (this._helpRaf) cancelAnimationFrame(this._helpRaf); this._helpRaf = null; this.lastTime = performance.now(); this.loop(); return; }
    if (this.over) {
      if (e.key === 'r') { this.destroy(); gameInstance = new GamePacman(); gameInstance.init(); return; }
      if (e.key === 'h' || e.key === 'H') { showHighScores('pacman'); return; }
      if (e.key === 'Escape') { backToMenu(); return; }
      return;
    }
    const map = { ArrowUp: { x: 0, y: -1 }, ArrowDown: { x: 0, y: 1 }, ArrowLeft: { x: -1, y: 0 }, ArrowRight: { x: 1, y: 0 } };
    if (map[e.key]) { e.preventDefault(); this.pacman.nextDir = map[e.key]; }
  }

  canMove(x, y) {
    if (y < 0 || y >= this.rows) return true; // tunnel
    if (x < 0 || x >= this.cols) return true; // tunnel wrap
    return this.map[y][x] !== 1;
  }

  loop() {
    if (this.over) { this.draw(); return; }
    if (!this.showHelp) {
      // Game mode — cancel any lingering help frame
      if (this._helpRaf) { cancelAnimationFrame(this._helpRaf); this._helpRaf = null; }
      if (this._raf) cancelAnimationFrame(this._raf);
      const now = performance.now(); const dt = now - this.lastTime; this.lastTime = now;
      this.moveTimer += dt;
      if (this.moveTimer >= this.moveSpeed) {
        this.moveTimer = 0;
        this.movePacman();
        this.moveGhosts();
      }
      this.draw();
      this._raf = requestAnimationFrame(() => this.loop());
      return;
    }
    // Help mode — guard in case showHelp was just set to false
    if (!this.showHelp) return;
    this.drawHelp();
    this._helpRaf = requestAnimationFrame(() => this.loop());
  }

  movePacman() {
    const p = this.pacman;
    // Try next dir
    let nx = p.x + p.nextDir.x, ny = p.y + p.nextDir.y;
    if (nx < 0) nx = this.cols - 1; if (nx >= this.cols) nx = 0;
    if (this.canMove(nx, ny)) p.dir = p.nextDir;
    // Move in current dir
    nx = p.x + p.dir.x; ny = p.y + p.dir.y;
    if (nx < 0) nx = this.cols - 1; if (nx >= this.cols) nx = 0;
    if (this.canMove(nx, ny)) { p.x = nx; p.y = ny; }
    // Eat dot
    if (this.map[p.y] && this.map[p.y][p.x] === 0) {
      this.map[p.y][p.x] = 2; this.score += 10; this.dots--;
    }
    // Power pellet
    if (this.map[p.y] && this.map[p.y][p.x] === 3) {
      this.map[p.y][p.x] = 2; this.score += 50; this.dots--; this.powered = 300;
    }
    if (this.powered > 0) this.powered--;
    // Mouth animation
    p.mouth += p.mouthDir * 0.15;
    if (p.mouth > 0.4 || p.mouth < 0) p.mouthDir = -p.mouthDir;
    // Win check
    if (this.dots <= 0) { this.over = true; saveHighScore('pacman', this.score, {}); clearGameProgress('pacman'); }
    // Ghost collision
    this.ghosts.forEach(g => {
      if (g.x === p.x && g.y === p.y) {
        if (this.powered > 0) { g.x = 12; g.y = 13; this.score += 200; }
        else {
          this.lives--;
          if (this.lives <= 0) { this.over = true; saveHighScore('pacman', this.score, {}); clearGameProgress('pacman'); }
          else { p.x = 12; p.y = 20; p.dir = { x: 0, y: 0 }; p.nextDir = { x: 0, y: 0 }; }
        }
      }
    });
  }

  moveGhosts() {
    this.ghostTimer++;
    if (this.ghostTimer % 2 !== 0) return; // ghosts move slower
    this.ghosts.forEach(g => {
      const dirs = [{ x: 0, y: -1 }, { x: 0, y: 1 }, { x: -1, y: 0 }, { x: 1, y: 0 }];
      // Don't reverse
      const reverse = { x: -g.dir.x, y: -g.dir.y };
      const valid = dirs.filter(d => !(d.x === reverse.x && d.y === reverse.y));
      let choices = valid.filter(d => {
        let nx = g.x + d.x, ny = g.y + d.y;
        if (nx < 0) nx = this.cols - 1; if (nx >= this.cols) nx = 0;
        return this.canMove(nx, ny);
      });
      if (choices.length === 0) choices = valid; // stuck
      if (choices.length > 0) {
        // Simple chase: prefer direction toward pacman
        const p = this.pacman;
        choices.sort((a, b) => {
          const da = Math.abs(g.x + a.x - p.x) + Math.abs(g.y + a.y - p.y);
          const db = Math.abs(g.x + b.x - p.x) + Math.abs(g.y + b.y - p.y);
          return da - db;
        });
        g.dir = this.powered > 0 ? choices[Math.floor(Math.random() * choices.length)] : choices[0];
        let nx = g.x + g.dir.x, ny = g.y + g.dir.y;
        if (nx < 0) nx = this.cols - 1; if (nx >= this.cols) nx = 0;
        if (this.canMove(nx, ny)) { g.x = nx; g.y = ny; }
      }
    });
  }

  drawHelp() {
    ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center';
    ctx.fillStyle = C.yellow; ctx.font = '28px Consolas, monospace';
    ctx.shadowColor = C.yellow; ctx.shadowBlur = 12;
    ctx.fillText('P A C - M A N', W/2, 100); ctx.shadowBlur = 0;
    ctx.fillStyle = C.amber; ctx.font = '14px Consolas, monospace';
    ctx.fillText('EAT ALL DOTS', W/2, 140);
    const lines = [['↑ ↓ ← →', 'Move'],['',''],['Eat all dots','to win'],['Power pellets','turn tables on ghosts'],['Avoid ghosts','unless powered'],['',''],['3 lives total',''],['ESC','Back to menu']];
    ctx.textAlign = 'left'; let ly = 180;
    lines.forEach(l => { if (l[0]&&l[1]) { ctx.fillStyle=C.cyan;ctx.font='13px Consolas,monospace';ctx.fillText(l[0],W/2-100,ly);ctx.fillStyle=C.white;ctx.fillText(l[1],W/2+20,ly); } ly+=28; });
    ctx.textAlign='center';ctx.fillStyle=C.amber;ctx.font='14px Consolas,monospace';
    if(Math.floor(Date.now()/600)%2===0) ctx.fillText('Press any key to start...',W/2,H-60);
  }

  draw() {
    ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, H);
    const cs = this.cellSize;
    // Map
    for (let r = 0; r < this.rows; r++) for (let c = 0; c < this.cols; c++) {
      const x = this.ox + c * cs, y = this.oy + r * cs;
      const v = this.map[r][c];
      if (v === 1) { ctx.fillStyle = '#1a1a6e'; ctx.fillRect(x, y, cs, cs); ctx.strokeStyle = '#2a2a8e'; ctx.lineWidth = 0.5; ctx.strokeRect(x+1, y+1, cs-2, cs-2); }
      else if (v === 0) { ctx.fillStyle = '#ffff00'; ctx.beginPath(); ctx.arc(x + cs/2, y + cs/2, 2, 0, Math.PI*2); ctx.fill(); }
      else if (v === 3) { ctx.fillStyle = '#ffff00'; ctx.beginPath(); ctx.arc(x + cs/2, y + cs/2, 5, 0, Math.PI*2); ctx.fill(); }
    }
    // Pac-Man
    const p = this.pacman;
    const px = this.ox + p.x * cs + cs/2, py = this.oy + p.y * cs + cs/2;
    const angle = Math.atan2(p.dir.y, p.dir.x);
    ctx.fillStyle = this.powered > 0 ? '#ffff88' : '#ffff00';
    ctx.beginPath();
    ctx.arc(px, py, cs/2 - 1, angle + p.mouth, angle + Math.PI*2 - p.mouth);
    ctx.lineTo(px, py);
    ctx.fill();
    // Ghosts
    this.ghosts.forEach(g => {
      const gx = this.ox + g.x * cs + cs/2, gy = this.oy + g.y * cs + cs/2;
      ctx.fillStyle = this.powered > 0 ? '#2222ff' : g.color;
      ctx.beginPath();
      ctx.arc(gx, gy - 2, cs/2 - 1, Math.PI, 0);
      ctx.lineTo(gx + cs/2 - 1, gy + cs/2 - 1);
      // Wavy bottom
      for (let i = 3; i >= -3; i--) {
        const wave = (i % 2 === 0) ? cs/2 - 1 : cs/2 - 5;
        ctx.lineTo(gx + i * (cs/6), gy + wave * 0.4 + cs/4);
      }
      ctx.lineTo(gx - cs/2 + 1, gy + cs/2 - 1);
      ctx.fill();
      // Eyes
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(gx - 3, gy - 3, 2.5, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(gx + 3, gy - 3, 2.5, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#00f';
      ctx.beginPath(); ctx.arc(gx - 3 + g.dir.x*1.5, gy - 3 + g.dir.y*1.5, 1.5, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(gx + 3 + g.dir.x*1.5, gy - 3 + g.dir.y*1.5, 1.5, 0, Math.PI*2); ctx.fill();
    });
    // HUD
    ctx.fillStyle = C.amber; ctx.font = '13px Consolas, monospace'; ctx.textAlign = 'left';
    ctx.fillText('SCORE ' + this.score, 10, 20);
    ctx.fillStyle = C.red; ctx.textAlign = 'right';
    ctx.fillText('♥'.repeat(this.lives), W-10, 20);
    // Power indicator
    if (this.powered > 0) { ctx.fillStyle = '#2222ff'; ctx.font = '10px Consolas'; ctx.textAlign = 'center'; ctx.fillText('POWER ' + Math.ceil(this.powered/60) + 's', W/2, 20); }
    // Game over
    if (this.over) {
      ctx.fillStyle = 'rgba(0,0,0,0.75)'; ctx.fillRect(0, 0, W, H);
      ctx.textAlign = 'center';
      ctx.fillStyle = this.dots <= 0 ? C.green : C.red;
      ctx.font = '28px Consolas, monospace'; ctx.fillText(this.dots <= 0 ? 'YOU WIN!' : 'GAME OVER', W/2, H/2-40);
      ctx.fillStyle = C.amber; ctx.font = '18px Consolas, monospace'; ctx.fillText('Score: ' + this.score, W/2, H/2-10);
      const hi = getHighScore('pacman');
      if (hi > 0) { ctx.fillStyle = C.yellow; ctx.font = '12px Consolas, monospace'; ctx.fillText('BEST: ' + hi, W/2, H/2+15); }
      ctx.fillStyle = C.dim; ctx.font = '12px Consolas, monospace'; ctx.fillText('R restart · ESC menu · H scores', W/2, H/2+45);
    }
  }
}

// ══════════════════════════════════════════════
//  PONG — Classic paddle game
// ══════════════════════════════════════════════
class GamePong {
  constructor() {
    this.paddleH = 70; this.paddleW = 10;
    this.p1Y = H/2 - this.paddleH/2; this.p2Y = H/2 - this.paddleH/2;
    this.score1 = 0; this.score2 = 0; this.maxScore = 11;
    this.over = false; this.paused = false; this.showHelp = true;
    this.keys = {};
    // 7-level difficulty system
    this.level = 1;
    this.levelThresholds = [2, 4, 6, 8, 10, 12, 14];
    this.ballColors = [C.white, C.red, C.cyan, C.amber, C.magenta, C.green, C.blue];
    this.balls = [];
    this._respawnTimers = []; // {dir, timeLeft}
  }

  get aiSpeed() { return 3 + this.level * 0.8; }
  get ballSpeedMult() { return 1 + (this.level - 1) * 0.12; }

  _createBall(dir, centerX, centerY) {
    const baseSpeed = 4 * this.ballSpeedMult;
    return {
      x: centerX !== undefined ? centerX : W/2,
      y: centerY !== undefined ? centerY : H/2,
      vx: baseSpeed * dir * (Math.random() > 0.5 ? 1 : -1),
      vy: baseSpeed * 0.5 * (Math.random() > 0.5 ? 1 : -1),
      color: this.ballColors[Math.floor(Math.random() * this.ballColors.length)]
    };
  }

  init(savedState) {
    if (savedState) {
      this.score1 = savedState.score1; this.score2 = savedState.score2;
      this.over = savedState.over || false; this.showHelp = false;
      this.p1Y = savedState.p1Y; this.p2Y = savedState.p2Y;
    } else { this.score1 = 0; this.score2 = 0; this.over = false; this.showHelp = true; }
    this.level = 1;
    this.balls = [this._createBall(1)];
    this._respawnTimers = [];
    this._keyD = (e) => { this.keys[e.key] = true; this.keyDown(e); };
    this._keyU = (e) => { this.keys[e.key] = false; };
    document.addEventListener('keydown', this._keyD);
    document.addEventListener('keyup', this._keyU);
    this.lastTime = performance.now();
    this.loop();
  }

  saveProgress() { saveGameProgress('pong', { score1: this.score1, score2: this.score2, p1Y: this.p1Y, p2Y: this.p2Y, over: this.over }); }
  destroy() { document.removeEventListener('keydown', this._keyD); document.removeEventListener('keyup', this._keyU); if (this._raf) cancelAnimationFrame(this._raf); if (this._helpRaf) cancelAnimationFrame(this._helpRaf); }

  keyDown(e) {
    if (this.showHelp) { if (e.key === 'Escape') { backToMenu(); return; } this.showHelp = false; this.lastTime = performance.now(); this.loop(); return; }
    if (this.over) {
      if (e.key === 'r') { this.destroy(); gameInstance = new GamePong(); gameInstance.init(); return; }
      if (e.key === 'h' || e.key === 'H') { showHighScores('pong'); return; }
      if (e.key === 'Escape') { backToMenu(); return; }
      return;
    }
    if (e.key === 'Escape') { backToMenu(); return; }
    if (e.key === 'p') { this.paused = !this.paused; if (!this.paused) this.lastTime = performance.now(); return; }
  }

  loop() {
    if (this.over) { this.draw(); return; }
    if (!this.showHelp) {
      if (this._helpRaf) { cancelAnimationFrame(this._helpRaf); this._helpRaf = null; }
      if (this.paused) { this.draw(); this._raf = requestAnimationFrame(() => this.loop()); return; }
      const now = performance.now(); const dt = Math.min((now - this.lastTime)/1000, 0.05); this.lastTime = now;
      this.update(dt); this.draw();
      this._raf = requestAnimationFrame(() => this.loop());
      return;
    }
    if (!this.showHelp) return;
    this.drawHelp();
    this._helpRaf = requestAnimationFrame(() => this.loop());
  }

  _checkLevelUp() {
    const totalScore = this.score1 + this.score2;
    while (this.level <= this.levelThresholds.length && totalScore >= this.levelThresholds[this.level - 1]) {
      this.level++;
      // Add a new ball
      if (this.balls.length < 7) {
        const dir = Math.random() > 0.5 ? 1 : -1;
        this.balls.push(this._createBall(dir));
      }
      // Apply speed multiplier to all existing balls
      const mult = 1.12; // each level adds 12%
      this.balls.forEach(b => { b.vx *= mult; b.vy *= mult; });
    }
  }

  update(dt) {
    const spd = 350 * dt;
    // Player 1: W/S
    if (this.keys['w'] || this.keys['W']) this.p1Y = Math.max(0, this.p1Y - spd);
    if (this.keys['s'] || this.keys['S']) this.p1Y = Math.min(H - this.paddleH, this.p1Y + spd);
    // Player 2 (AI): tracks the ball closest to its side (right)
    let aiTargetBall = this.balls.find(b => !!b) || { y: H / 2 };
    let aiMaxX = -Infinity;
    this.balls.forEach(b => { if (b && b.x > aiMaxX) { aiMaxX = b.x; aiTargetBall = b; } });
    const aiTarget = aiTargetBall.y - this.paddleH / 2;
    if (this.p2Y < aiTarget) this.p2Y = Math.min(aiTarget, this.p2Y + this.aiSpeed);
    else if (this.p2Y > aiTarget) this.p2Y = Math.max(aiTarget, this.p2Y - this.aiSpeed);
    this.p2Y = Math.max(0, Math.min(H - this.paddleH, this.p2Y));
    // Process respawn timers
    this._respawnTimers = this._respawnTimers.filter(t => {
      t.timeLeft -= dt;
      if (t.timeLeft <= 0) {
        this.balls.push(this._createBall(t.dir));
        return false;
      }
      return true;
    });
    // Update each ball
    const p1x = 20, p2x = W - 30;
    const scoredBalls = [];
    for (let i = this.balls.length - 1; i >= 0; i--) {
      const b = this.balls[i];
      if (!b) { this.balls.splice(i, 1); continue; }
      b.x += b.vx * dt * 60;
      b.y += b.vy * dt * 60;
      // Top/bottom bounce
      if (b.y <= 0) { b.vy = Math.abs(b.vy); b.y = 0; }
      if (b.y >= H) { b.vy = -Math.abs(b.vy); b.y = H; }
      // Paddle collision — left paddle
      if (b.vx < 0 && b.x <= p1x + this.paddleW && b.x >= p1x && b.y >= this.p1Y && b.y <= this.p1Y + this.paddleH) {
        b.vx = Math.abs(b.vx) * 1.05;
        b.vy += (b.y - (this.p1Y + this.paddleH/2)) * 0.1;
      }
      // Paddle collision — right paddle (AI)
      if (b.vx > 0 && b.x >= p2x && b.x <= p2x + this.paddleW && b.y >= this.p2Y && b.y <= this.p2Y + this.paddleH) {
        b.vx = -Math.abs(b.vx) * 1.05;
        b.vy += (b.y - (this.p2Y + this.paddleH/2)) * 0.1;
      }
      // Score detection (mark for removal, don't splice mid-loop)
      if (b.x < 0) { scoredBalls.push({ idx: i, scorer: 2 }); }
      else if (b.x > W) { scoredBalls.push({ idx: i, scorer: 1 }); }
    }
    // Process scored balls (remove + schedule respawn)
    scoredBalls.sort((a, b) => b.idx - a.idx); // remove from end first
    scoredBalls.forEach(s => {
      this.balls.splice(s.idx, 1);
      if (s.scorer === 2) { this.score2++; this._respawnTimers.push({ dir: 1, timeLeft: 1.0 }); }
      else { this.score1++; this._respawnTimers.push({ dir: -1, timeLeft: 1.0 }); }
      this._checkLevelUp();
    });
    // Win
    if (this.score1 >= this.maxScore || this.score2 >= this.maxScore) {
      this.over = true;
      saveHighScore('pong', this.score1, {});
      clearGameProgress('pong');
    }
  }

  drawHelp() {
    ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center';
    ctx.fillStyle = C.green; ctx.font = '28px Consolas, monospace';
    ctx.shadowColor = C.green; ctx.shadowBlur = 12;
    ctx.fillText('P O N G', W/2, 100); ctx.shadowBlur = 0;
    ctx.fillStyle = C.amber; ctx.font = '14px Consolas, monospace';
    ctx.fillText('7-LEVEL MULTI-BALL MODE', W/2, 140);
    const lines = [['W / S', 'Left paddle up/down'],['',''],['Level up','every 2 total points'],['More balls','each level!'],['',''],['vs AI opponent','']];
    ctx.textAlign = 'left'; let ly = 180;
    lines.forEach(l => { if (l[0]&&l[1]) { ctx.fillStyle=C.cyan;ctx.font='13px Consolas,monospace';ctx.fillText(l[0],W/2-100,ly);ctx.fillStyle=C.white;ctx.fillText(l[1],W/2+20,ly); } ly+=28; });
    ctx.textAlign='center';ctx.fillStyle=C.amber;ctx.font='14px Consolas,monospace';
    if(Math.floor(Date.now()/600)%2===0) ctx.fillText('Press any key to start...',W/2,H-60);
  }

  draw() {
    ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, H);
    // Center line
    ctx.setLineDash([8, 8]); ctx.strokeStyle = C.dim; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(W/2, 0); ctx.lineTo(W/2, H); ctx.stroke();
    ctx.setLineDash([]);
    // Paddles
    ctx.fillStyle = C.green; ctx.fillRect(20, this.p1Y, this.paddleW, this.paddleH);
    ctx.fillStyle = C.amber; ctx.fillRect(W-30, this.p2Y, this.paddleW, this.paddleH);
    // Balls
    this.balls.forEach(b => {
      if (!b) return;
      ctx.fillStyle = b.color;
      ctx.beginPath(); ctx.arc(b.x, b.y, 6, 0, Math.PI*2); ctx.fill();
    });
    // Score
    ctx.font = '32px Consolas, monospace'; ctx.textAlign = 'center';
    ctx.fillStyle = C.green; ctx.fillText(this.score1, W/4, 50);
    ctx.fillStyle = C.amber; ctx.fillText(this.score2, W*3/4, 50);
    // Labels
    ctx.font = '10px Consolas, monospace'; ctx.fillStyle = C.dim;
    ctx.fillText('YOU (W/S)', W/4, 70); ctx.fillText('AI', W*3/4, 70);
    // Level display
    ctx.fillStyle = this.level > 1 ? C.red : C.dim;
    ctx.font = '12px Consolas, monospace'; ctx.textAlign = 'center';
    ctx.fillText('LV' + this.level + '  BALLS:' + this.balls.filter(b => !!b).length, W/2, H - 10);
    // Paused
    if (this.paused) { ctx.fillStyle = 'rgba(0,0,0,0.7)'; ctx.fillRect(0, 0, W, H); ctx.fillStyle = C.amber; ctx.font = '28px Consolas, monospace'; ctx.fillText('PAUSED', W/2, H/2); }
    // Game over
    if (this.over) {
      ctx.fillStyle = 'rgba(0,0,0,0.75)'; ctx.fillRect(0, 0, W, H);
      ctx.textAlign = 'center';
      ctx.fillStyle = this.score1 >= this.maxScore ? C.green : C.red;
      ctx.font = '28px Consolas, monospace'; ctx.fillText(this.score1 >= this.maxScore ? 'YOU WIN!' : 'YOU LOSE', W/2, H/2-40);
      ctx.fillStyle = C.amber; ctx.font = '18px Consolas, monospace'; ctx.fillText(this.score1 + ' - ' + this.score2, W/2, H/2-10);
      ctx.fillStyle = C.dim; ctx.font = '12px Consolas, monospace'; ctx.fillText('R restart · ESC menu · H scores', W/2, H/2+20);
    }
  }
}

// ══════════════════════════════════════════════
//  FROGGER — Cross the road
// ══════════════════════════════════════════════
class GameFrogger {
  constructor() {
    this.cellW = 24; this.cellH = 24;
    this.cols = 20; this.rows = 15;
    this.ox = (W - this.cols * this.cellW) / 2;
    this.oy = (H - this.rows * this.cellH) / 2;
    this.frog = { x: 10, y: 14 };
    this.lanes = [];
    this.score = 0; this.lives = 3; this.over = false;
    this.showHelp = true;
    this.homeCount = 0; this.homes = [false, false, false, false, false];
  }

  init(savedState) {
    if (savedState) {
      this.score = savedState.score; this.lives = savedState.lives;
      this.over = savedState.over || false; this.showHelp = false;
      this.frog = savedState.frog; this.homeCount = savedState.homeCount || 0;
      this.homes = savedState.homes || [false,false,false,false,false];
    } else {
      this.score = 0; this.lives = 3; this.over = false; this.showHelp = true;
      this.frog = { x: 10, y: 14 }; this.homeCount = 0;
      this.homes = [false, false, false, false, false];
    }
    this.initLanes();
    this._keyD = (e) => this.key(e);
    document.addEventListener('keydown', this._keyD);
    this.lastTime = performance.now();
    this.loop();
  }

  initLanes() {
    // Row 0: safe home row (goal)
    // Rows 1-5: river (logs/turtles)
    // Row 6: safe median
    // Rows 7-13: road (cars/trucks)
    // Row 14: start safe
    this.lanes = [
      { type: 'river', items: [], speed: 0, dir: 1 },      // 0: home row
      { type: 'river', items: this.makeItems(3, 90, 1), speed: 0.8, dir: 1 },  // 1: logs
      { type: 'river', items: this.makeItems(2, 60, -1), speed: -1.2, dir: -1 }, // 2: turtles
      { type: 'river', items: this.makeItems(3, 80, 1), speed: 0.6, dir: 1 },  // 3: logs
      { type: 'river', items: this.makeItems(4, 40, -1), speed: -1.5, dir: -1 }, // 4: turtles
      { type: 'river', items: this.makeItems(2, 100, 1), speed: 1.0, dir: 1 }, // 5: logs
      { type: 'safe', items: [], speed: 0, dir: 1 },        // 6: median
      { type: 'road', items: this.makeItems(2, 50, 1), speed: 1.5, dir: 1 },   // 7: cars
      { type: 'road', items: this.makeItems(3, 35, -1), speed: -2.0, dir: -1 }, // 8: trucks
      { type: 'road', items: this.makeItems(2, 60, 1), speed: 1.0, dir: 1 },   // 9: cars
      { type: 'road', items: this.makeItems(1, 120, -1), speed: -0.8, dir: -1 }, // 10: truck
      { type: 'road', items: this.makeItems(3, 40, 1), speed: 2.5, dir: 1 },   // 11: fast cars
      { type: 'road', items: this.makeItems(2, 55, -1), speed: -1.3, dir: -1 }, // 12: cars
      { type: 'safe', items: [], speed: 0, dir: 1 },        // 13: safe
      { type: 'safe', items: [], speed: 0, dir: 1 },        // 14: start
    ];
  }

  makeItems(count, spacing, dir) {
    const items = [];
    for (let i = 0; i < count; i++) {
      items.push({ x: i * spacing * dir * (dir > 0 ? 1 : -1), w: spacing * 0.6 });
    }
    return items;
  }

  destroy() { document.removeEventListener('keydown', this._keyD); if (this._raf) cancelAnimationFrame(this._raf); if (this._helpRaf) cancelAnimationFrame(this._helpRaf); }
  saveProgress() { saveGameProgress('frogger', { score: this.score, lives: this.lives, frog: this.frog, homeCount: this.homeCount, homes: this.homes, over: this.over }); }

  key(e) {
    if (this.showHelp) { if (e.key === 'Escape') { backToMenu(); return; } this.showHelp = false; this.lastTime = performance.now(); this.loop(); return; }
    if (this.over) {
      if (e.key === 'r') { this.destroy(); gameInstance = new GameFrogger(); gameInstance.init(); return; }
      if (e.key === 'h' || e.key === 'H') { showHighScores('frogger'); return; }
      if (e.key === 'Escape') { backToMenu(); return; }
      return;
    }
    if (e.key === 'Escape') { backToMenu(); return; }
    const map = { ArrowUp: {x:0,y:-1}, ArrowDown: {x:0,y:1}, ArrowLeft: {x:-1,y:0}, ArrowRight: {x:1,y:0} };
    const d = map[e.key];
    if (d) {
      e.preventDefault();
      const nx = this.frog.x + d.x, ny = this.frog.y + d.y;
      if (nx >= 0 && nx < this.cols && ny >= 0 && ny < this.rows) {
        this.frog.x = nx; this.frog.y = ny;
        if (d.y < 0) this.score += 10; // points for moving forward
      }
    }
  }

  loop() {
    if (this.over) { this.draw(); return; }
    if (!this.showHelp) {
      if (this._helpRaf) { cancelAnimationFrame(this._helpRaf); this._helpRaf = null; }
      const now = performance.now(); const dt = Math.min((now - this.lastTime)/1000, 0.05); this.lastTime = now;
      this.update(dt); this.draw();
      this._raf = requestAnimationFrame(() => this.loop());
      return;
    }
    if (!this.showHelp) return;
    this.drawHelp();
    this._helpRaf = requestAnimationFrame(() => this.loop());
  }

  update(dt) {
    const cs = this.cellW;
    // Move lanes
    this.lanes.forEach((lane, row) => {
      if (lane.speed === 0) return;
      lane.items.forEach(item => {
        item.x += lane.speed * dt * 30;
        // Wrap
        if (lane.speed > 0 && item.x > this.cols * cs) item.x = -item.w;
        if (lane.speed < 0 && item.x + item.w < 0) item.x = this.cols * cs;
      });
    });
    // Check frog position
    const lane = this.lanes[this.frog.y];
    if (!lane) return;
    if (lane.type === 'river') {
      // Must be on a log/turtle
      const fx = this.frog.x * cs;
      const onPlatform = lane.items.some(item => fx >= item.x - cs/2 && fx <= item.x + item.w + cs/2);
      if (!onPlatform) { this.die(); return; }
      // Move frog with platform
      this.frog.x += lane.speed * dt * 30 / cs;
      if (this.frog.x < 0 || this.frog.x >= this.cols) { this.die(); return; }
    }
    if (lane.type === 'road') {
      // Check car collision
      const fx = this.frog.x * cs;
      const hitCar = lane.items.some(item => fx >= item.x - cs && fx <= item.x + item.w);
      if (hitCar) { this.die(); return; }
    }
    // Home row check
    if (this.frog.y === 0) {
      const homeSlots = [2, 6, 10, 14, 18];
      const slotIdx = homeSlots.findIndex(s => Math.abs(this.frog.x - s) < 1.5);
      if (slotIdx >= 0 && !this.homes[slotIdx]) {
        this.homes[slotIdx] = true; this.homeCount++; this.score += 200;
        this.frog = { x: 10, y: 14 };
        if (this.homeCount >= 5) { this.over = true; saveHighScore('frogger', this.score, {}); clearGameProgress('frogger'); }
      } else { this.die(); }
    }
  }

  die() {
    this.lives--;
    if (this.lives <= 0) { this.over = true; saveHighScore('frogger', this.score, {}); clearGameProgress('frogger'); }
    else this.frog = { x: 10, y: 14 };
  }

  drawHelp() {
    ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center';
    ctx.fillStyle = C.green; ctx.font = '24px Consolas, monospace';
    ctx.shadowColor = C.green; ctx.shadowBlur = 12;
    ctx.fillText('F R O G G E R', W/2, 100); ctx.shadowBlur = 0;
    ctx.fillStyle = C.amber; ctx.font = '14px Consolas, monospace';
    ctx.fillText('CROSS THE ROAD & RIVER', W/2, 140);
    const lines = [['↑ ↓ ← →', 'Move frog'],['',''],['Avoid cars','on the road'],['Ride logs','across the river'],['Reach 5 home','slots to win'],['',''],['3 lives total','']];
    ctx.textAlign = 'left'; let ly = 180;
    lines.forEach(l => { if (l[0]&&l[1]) { ctx.fillStyle=C.cyan;ctx.font='13px Consolas,monospace';ctx.fillText(l[0],W/2-100,ly);ctx.fillStyle=C.white;ctx.fillText(l[1],W/2+20,ly); } ly+=28; });
    ctx.textAlign='center';ctx.fillStyle=C.amber;ctx.font='14px Consolas,monospace';
    if(Math.floor(Date.now()/600)%2===0) ctx.fillText('Press any key to start...',W/2,H-60);
  }

  draw() {
    ctx.fillStyle = '#0a0a0a'; ctx.fillRect(0, 0, W, H);
    const cs = this.cellW;
    // Draw lanes
    this.lanes.forEach((lane, row) => {
      const y = this.oy + row * cs;
      // Background
      if (lane.type === 'river') { ctx.fillStyle = '#001133'; ctx.fillRect(this.ox, y, this.cols * cs, cs); }
      else if (lane.type === 'road') { ctx.fillStyle = '#1a1a1a'; ctx.fillRect(this.ox, y, this.cols * cs, cs); }
      else if (row === 0) { ctx.fillStyle = '#002200'; ctx.fillRect(this.ox, y, this.cols * cs, cs); }
      else { ctx.fillStyle = '#0a0a0a'; ctx.fillRect(this.ox, y, this.cols * cs, cs); }
      // Items
      lane.items.forEach(item => {
        const ix = this.ox + item.x;
        if (lane.type === 'river') { ctx.fillStyle = '#8B4513'; ctx.fillRect(ix, y + 2, item.w, cs - 4); }
        else if (lane.type === 'road') { ctx.fillStyle = '#cc0000'; ctx.fillRect(ix, y + 3, item.w, cs - 6); }
      });
    });
    // Home slots
    const homeSlots = [2, 6, 10, 14, 18];
    homeSlots.forEach((s, i) => {
      const hx = this.ox + s * cs;
      ctx.fillStyle = this.homes[i] ? C.green : '#003300';
      ctx.fillRect(hx, this.oy + 2, cs - 4, cs - 4);
    });
    // Frog
    const fx = this.ox + this.frog.x * cs, fy = this.oy + this.frog.y * cs;
    ctx.fillStyle = C.green;
    ctx.fillRect(fx + 2, fy + 2, cs - 4, cs - 4);
    // Eyes
    ctx.fillStyle = '#fff';
    ctx.fillRect(fx + 4, fy + 4, 4, 4);
    ctx.fillRect(fx + cs - 8, fy + 4, 4, 4);
    // HUD
    ctx.fillStyle = C.amber; ctx.font = '12px Consolas, monospace'; ctx.textAlign = 'left';
    ctx.fillText('SCORE ' + this.score, 10, 20);
    ctx.fillStyle = C.red; ctx.textAlign = 'right';
    ctx.fillText('♥'.repeat(this.lives), W-10, 20);
    ctx.fillStyle = C.cyan; ctx.textAlign = 'center';
    ctx.fillText('HOME ' + this.homeCount + '/5', W/2, 20);
    // Game over
    if (this.over) {
      ctx.fillStyle = 'rgba(0,0,0,0.75)'; ctx.fillRect(0, 0, W, H);
      ctx.textAlign = 'center';
      ctx.fillStyle = this.homeCount >= 5 ? C.green : C.red;
      ctx.font = '28px Consolas, monospace'; ctx.fillText(this.homeCount >= 5 ? 'YOU WIN!' : 'GAME OVER', W/2, H/2-40);
      ctx.fillStyle = C.amber; ctx.font = '18px Consolas, monospace'; ctx.fillText('Score: ' + this.score, W/2, H/2-10);
      const hi = getHighScore('frogger');
      if (hi > 0) { ctx.fillStyle = C.yellow; ctx.font = '12px Consolas, monospace'; ctx.fillText('BEST: ' + hi, W/2, H/2+15); }
      ctx.fillStyle = C.dim; ctx.font = '12px Consolas, monospace'; ctx.fillText('R restart · ESC menu · H scores', W/2, H/2+45);
    }
  }
}

// ══════════════════════════════════════════════
//  BOMBERMAN — Blast walls and enemies
// ══════════════════════════════════════════════
class GameBomberman {
  constructor() {
    this.cols = 15; this.rows = 13;
    this.cellSize = Math.floor(Math.min((W - 40) / this.cols, (H - 100) / this.rows));
    this.ox = (W - this.cols * this.cellSize) / 2;
    this.oy = 60;
    this.map = []; // 0=empty, 1=indestructible, 2=destructible
    this.player = { x: 1, y: 1 };
    this.bombs = []; this.explosions = [];
    this.enemies = []; this.powerups = [];
    this.score = 0; this.lives = 3; this.over = false;
    this.bombRange = 2; this.maxBombs = 1; this.activeBombs = 0;
    this.showHelp = true; this.moveTimer = 0; this.moveCD = 150;
    this.enemyTimer = 0;
  }

  init(savedState) {
    if (savedState) {
      this.score = savedState.score; this.lives = savedState.lives;
      this.over = savedState.over || false; this.showHelp = false;
      this.player = savedState.player; this.bombRange = savedState.bombRange || 2;
      this.maxBombs = savedState.maxBombs || 1;
      this.map = savedState.map; this.enemies = savedState.enemies || [];
    } else {
      this.score = 0; this.lives = 3; this.over = false; this.showHelp = true;
      this.player = { x: 1, y: 1 }; this.bombRange = 2; this.maxBombs = 1;
      this.initMap();
    }
    this.bombs = []; this.explosions = []; this.powerups = []; this.activeBombs = 0;
    this._keyD = (e) => this.key(e);
    this._keyU = () => {};
    document.addEventListener('keydown', this._keyD);
    this.lastTime = performance.now();
    this.loop();
  }

  initMap() {
    this.map = [];
    this.enemies = [];
    for (let r = 0; r < this.rows; r++) {
      this.map[r] = [];
      for (let c = 0; c < this.cols; c++) {
        if (r === 0 || r === this.rows-1 || c === 0 || c === this.cols-1) { this.map[r][c] = 1; continue; }
        if (r % 2 === 0 && c % 2 === 0) { this.map[r][c] = 1; continue; }
        // Clear spawn area
        if ((r <= 2 && c <= 2)) { this.map[r][c] = 0; continue; }
        this.map[r][c] = Math.random() < 0.5 ? 2 : 0;
      }
    }
    // Spawn enemies
    for (let i = 0; i < 4; i++) {
      let ex, ey;
      do { ex = Math.floor(Math.random() * (this.cols-2)) + 1; ey = Math.floor(Math.random() * (this.rows-2)) + 1; }
      while (this.map[ey][ex] !== 0 || (ex <= 3 && ey <= 3));
      this.enemies.push({ x: ex, y: ey, dir: Math.floor(Math.random()*4), timer: 0 });
    }
  }

  destroy() { document.removeEventListener('keydown', this._keyD); if (this._raf) cancelAnimationFrame(this._raf); if (this._helpRaf) cancelAnimationFrame(this._helpRaf); }
  saveProgress() { saveGameProgress('bomberman', { score: this.score, lives: this.lives, player: this.player, bombRange: this.bombRange, maxBombs: this.maxBombs, map: this.map, enemies: this.enemies, over: this.over }); }

  key(e) {
    if (this.showHelp) { if (e.key === 'Escape') { backToMenu(); return; } this.showHelp = false; this.lastTime = performance.now(); this.loop(); return; }
    if (this.over) {
      if (e.key === 'r') { this.destroy(); gameInstance = new GameBomberman(); gameInstance.init(); return; }
      if (e.key === 'h' || e.key === 'H') { showHighScores('bomberman'); return; }
      if (e.key === 'Escape') { backToMenu(); return; }
      return;
    }
    if (e.key === 'Escape') { backToMenu(); return; }
    const now = performance.now();
    if (now - this.moveTimer < this.moveCD) return;
    const map = { ArrowUp: {x:0,y:-1}, ArrowDown: {x:0,y:1}, ArrowLeft: {x:-1,y:0}, ArrowRight: {x:1,y:0} };
    const d = map[e.key];
    if (d) {
      e.preventDefault(); this.moveTimer = now;
      const nx = this.player.x + d.x, ny = this.player.y + d.y;
      if (nx >= 0 && nx < this.cols && ny >= 0 && ny < this.rows && this.map[ny][nx] === 0) {
        // Check bombs blocking
        if (!this.bombs.some(b => b.x === nx && b.y === ny)) { this.player.x = nx; this.player.y = ny; }
      }
    }
    if (e.key === ' ' || e.key === 'b' || e.key === 'B') {
      e.preventDefault();
      if (this.activeBombs < this.maxBombs && !this.bombs.some(b => b.x === this.player.x && b.y === this.player.y)) {
        this.bombs.push({ x: this.player.x, y: this.player.y, timer: 180, range: this.bombRange });
        this.activeBombs++;
      }
    }
  }

  loop() {
    if (this.over) { this.draw(); return; }
    if (!this.showHelp) {
      if (this._helpRaf) { cancelAnimationFrame(this._helpRaf); this._helpRaf = null; }
      const now = performance.now(); const dt = now - this.lastTime; this.lastTime = now;
      this.update(dt); this.draw();
      this._raf = requestAnimationFrame(() => this.loop());
      return;
    }
    if (!this.showHelp) return;
    this.drawHelp();
    this._helpRaf = requestAnimationFrame(() => this.loop());
  }

  update(dt) {
    // Bombs
    for (let i = this.bombs.length - 1; i >= 0; i--) {
      this.bombs[i].timer -= dt / 16;
      if (this.bombs[i].timer <= 0) {
        this.explode(this.bombs[i]);
        this.bombs.splice(i, 1); this.activeBombs--;
      }
    }
    // Explosions
    this.explosions = this.explosions.filter(e => { e.timer -= dt / 16; return e.timer > 0; });
    // Enemies
    this.enemyTimer += dt;
    if (this.enemyTimer > 800) {
      this.enemyTimer = 0;
      this.enemies.forEach(e => {
        const dirs = [{x:0,y:-1},{x:0,y:1},{x:-1,y:0},{x:1,y:0}];
        // Sometimes change dir
        if (Math.random() < 0.3) e.dir = Math.floor(Math.random() * 4);
        const d = dirs[e.dir];
        const nx = e.x + d.x, ny = e.y + d.y;
        if (nx >= 0 && nx < this.cols && ny >= 0 && ny < this.rows && this.map[ny][nx] === 0) {
          e.x = nx; e.y = ny;
        } else { e.dir = Math.floor(Math.random() * 4); }
      });
    }
    // Player-explosion collision
    if (this.explosions.some(ex => ex.x === this.player.x && ex.y === this.player.y)) {
      this.playerHit();
    }
    // Player-enemy collision
    if (this.enemies.some(en => en.x === this.player.x && en.y === this.player.y)) {
      this.playerHit();
    }
    // Explosion-enemy collision
    this.enemies = this.enemies.filter(en => {
      if (this.explosions.some(ex => ex.x === en.x && ex.y === en.y)) {
        this.score += 100; return false;
      }
      return true;
    });
    // Powerup collection
    this.powerups = this.powerups.filter(p => {
      if (p.x === this.player.x && p.y === this.player.y) {
        if (p.type === 'range') this.bombRange++;
        if (p.type === 'bomb') this.maxBombs++;
        this.score += 50; return false;
      }
      return true;
    });
    // Win: all enemies dead
    if (this.enemies.length === 0 && this.bombs.length === 0 && this.explosions.length === 0) {
      this.over = true; saveHighScore('bomberman', this.score, {}); clearGameProgress('bomberman');
    }
  }

  playerHit() {
    this.lives--;
    if (this.lives <= 0) { this.over = true; saveHighScore('bomberman', this.score, {}); clearGameProgress('bomberman'); }
    else { this.player = { x: 1, y: 1 }; }
  }

  explode(bomb) {
    const dirs = [{x:0,y:0},{x:0,y:-1},{x:0,y:1},{x:-1,y:0},{x:1,y:0}];
    for (const d of dirs) {
      for (let dist = 0; dist <= (d.x === 0 && d.y === 0 ? 0 : bomb.range); dist++) {
        const ex = bomb.x + d.x * dist, ey = bomb.y + d.y * dist;
        if (ex < 0 || ex >= this.cols || ey < 0 || ey >= this.rows) break;
        if (this.map[ey][ex] === 1) break; // indestructible
        this.explosions.push({ x: ex, y: ey, timer: 30 });
        if (this.map[ey][ex] === 2) {
          this.map[ey][ex] = 0; this.score += 10;
          // Drop powerup
          if (Math.random() < 0.25) this.powerups.push({ x: ex, y: ey, type: Math.random() < 0.5 ? 'range' : 'bomb' });
          break; // explosion stops at destructible
        }
      }
    }
  }

  drawHelp() {
    ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center';
    ctx.fillStyle = C.amber; ctx.font = '24px Consolas, monospace';
    ctx.shadowColor = C.amber; ctx.shadowBlur = 12;
    ctx.fillText('B O M B E R', W/2, 100); ctx.shadowBlur = 0;
    ctx.fillStyle = C.amber; ctx.font = '14px Consolas, monospace';
    ctx.fillText('BLAST ALL ENEMIES', W/2, 140);
    const lines = [['↑ ↓ ← →', 'Move'],['SPACE / B', 'Place bomb'],['',''],['Destroy walls','to find powerups'],['◆ Range (R)','+1 bomb range'],['◆ Extra (B)','+1 max bombs'],['',''],['Kill all enemies','to win']];
    ctx.textAlign = 'left'; let ly = 180;
    lines.forEach(l => { if (l[0]&&l[1]) { ctx.fillStyle=C.cyan;ctx.font='13px Consolas,monospace';ctx.fillText(l[0],W/2-100,ly);ctx.fillStyle=C.white;ctx.fillText(l[1],W/2+20,ly); } ly+=28; });
    ctx.textAlign='center';ctx.fillStyle=C.amber;ctx.font='14px Consolas,monospace';
    if(Math.floor(Date.now()/600)%2===0) ctx.fillText('Press any key to start...',W/2,H-40);
  }

  draw() {
    ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, H);
    const cs = this.cellSize;
    // Map
    for (let r = 0; r < this.rows; r++) for (let c = 0; c < this.cols; c++) {
      const x = this.ox + c * cs, y = this.oy + r * cs;
      if (this.map[r][c] === 1) { ctx.fillStyle = '#4a4a6a'; ctx.fillRect(x, y, cs, cs); ctx.strokeStyle = '#5a5a7a'; ctx.lineWidth = 0.5; ctx.strokeRect(x+1, y+1, cs-2, cs-2); }
      else if (this.map[r][c] === 2) { ctx.fillStyle = '#8B6914'; ctx.fillRect(x, y, cs, cs); ctx.strokeStyle = '#A07828'; ctx.lineWidth = 0.5; ctx.strokeRect(x+1, y+1, cs-2, cs-2); }
    }
    // Powerups
    this.powerups.forEach(p => {
      const x = this.ox + p.x * cs, y = this.oy + p.y * cs;
      ctx.fillStyle = p.type === 'range' ? C.cyan : C.amber;
      ctx.beginPath(); ctx.arc(x + cs/2, y + cs/2, cs/3, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.font = (cs/3) + 'px Consolas'; ctx.textAlign = 'center';
      ctx.fillText(p.type === 'range' ? 'R' : 'B', x + cs/2, y + cs/2 + cs/8);
    });
    // Bombs
    this.bombs.forEach(b => {
      const x = this.ox + b.x * cs, y = this.oy + b.y * cs;
      const pulse = 0.8 + Math.sin(b.timer * 0.2) * 0.2;
      ctx.fillStyle = '#333';
      ctx.beginPath(); ctx.arc(x + cs/2, y + cs/2, (cs/2 - 2) * pulse, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = C.red;
      ctx.beginPath(); ctx.arc(x + cs/2, y + cs/2 - cs/4, 3, 0, Math.PI*2); ctx.fill();
    });
    // Explosions
    this.explosions.forEach(ex => {
      const x = this.ox + ex.x * cs, y = this.oy + ex.y * cs;
      ctx.fillStyle = `rgba(255,${Math.floor(ex.timer*3)},0,${ex.timer/30})`;
      ctx.fillRect(x, y, cs, cs);
    });
    // Enemies
    this.enemies.forEach(e => {
      const x = this.ox + e.x * cs, y = this.oy + e.y * cs;
      ctx.fillStyle = '#ff3333';
      ctx.fillRect(x + 2, y + 2, cs - 4, cs - 4);
      ctx.fillStyle = '#fff';
      ctx.fillRect(x + cs/3, y + cs/3, 3, 3);
      ctx.fillRect(x + cs*2/3, y + cs/3, 3, 3);
    });
    // Player
    const px = this.ox + this.player.x * cs, py = this.oy + this.player.y * cs;
    ctx.fillStyle = C.green;
    ctx.fillRect(px + 2, py + 2, cs - 4, cs - 4);
    ctx.fillStyle = '#fff';
    ctx.fillRect(px + cs/3, py + cs/3, 3, 3);
    ctx.fillRect(px + cs*2/3, py + cs/3, 3, 3);
    // HUD
    ctx.fillStyle = C.amber; ctx.font = '12px Consolas, monospace'; ctx.textAlign = 'left';
    ctx.fillText('SCORE ' + this.score, 10, 20);
    ctx.fillStyle = C.cyan; ctx.fillText('RANGE:' + this.bombRange + ' BOMB:' + this.maxBombs, 10, 38);
    ctx.fillStyle = C.red; ctx.textAlign = 'right';
    ctx.fillText('♥'.repeat(this.lives) + ' EN:' + this.enemies.length, W-10, 20);
    // Game over
    if (this.over) {
      ctx.fillStyle = 'rgba(0,0,0,0.75)'; ctx.fillRect(0, 0, W, H);
      ctx.textAlign = 'center';
      ctx.fillStyle = this.enemies.length === 0 ? C.green : C.red;
      ctx.font = '28px Consolas, monospace'; ctx.fillText(this.enemies.length === 0 ? 'YOU WIN!' : 'GAME OVER', W/2, H/2-40);
      ctx.fillStyle = C.amber; ctx.font = '18px Consolas, monospace'; ctx.fillText('Score: ' + this.score, W/2, H/2-10);
      const hi = getHighScore('bomberman');
      if (hi > 0) { ctx.fillStyle = C.yellow; ctx.font = '12px Consolas, monospace'; ctx.fillText('BEST: ' + hi, W/2, H/2+15); }
      ctx.fillStyle = C.dim; ctx.font = '12px Consolas, monospace'; ctx.fillText('R restart · ESC menu · H scores', W/2, H/2+45);
    }
  }
}

// ══════════════════════════════════════════════
//  SPACE INVADERS
// ══════════════════════════════════════════════
class GameInvaders {
  constructor() { this.over = false; }

  init(savedState) {
    if (this._keyH) document.removeEventListener('keydown', this._keyH);
    this.score = 0; this.lives = 3; this.level = 1; this.over = false;
    this.player = { x: W / 2 - 15, w: 30, h: 16 };
    this.bullets = []; this.enemyBullets = [];
    this.enemies = []; this.barriers = [];
    this.dir = 1; this.moveTimer = 0; this.moveInterval = 600;
    this.shootTimer = 0; this.stars = Array.from({ length: 50 }, () => ({
      x: Math.random() * W, y: Math.random() * H, s: Math.random() * 1.5 + 0.5
    }));
    this.initLevel();
    this._keyH = (e) => this.key(e);
    document.addEventListener('keydown', this._keyH);
    this.lastTime = performance.now();
    this.loop();
  }

  initLevel() {
    this.enemies = [];
    const rows = 5, cols = 8, ew = 28, eh = 20, gap = 6;
    const sx = (W - cols * (ew + gap)) / 2;
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        this.enemies.push({
          x: sx + c * (ew + gap), y: 60 + r * (eh + gap),
          w: ew, h: eh, type: r < 1 ? 2 : r < 3 ? 1 : 0, alive: true
        });
      }
    }
    this.moveInterval = Math.max(200, 600 - this.level * 50);
    this.dir = 1;
  }

  saveProgress() { saveGameProgress('invaders', { score: this.score, lives: this.lives, level: this.level }); }
  destroy() { document.removeEventListener('keydown', this._keyH); if (this._raf) cancelAnimationFrame(this._raf); }

  key(e) {
    if (e.key === 'Escape') { backToMenu(); return; }
    if (this.over && e.key === 'r') { this.init(); return; }
    if (this.over && (e.key === 'h' || e.key === 'H')) { showHighScores('invaders'); return; }
    if (this.over) return;
    if (e.key === 'ArrowLeft') { e.preventDefault(); this.player.x = Math.max(5, this.player.x - 8); }
    if (e.key === 'ArrowRight') { e.preventDefault(); this.player.x = Math.min(W - this.player.w - 5, this.player.x + 8); }
    if (e.key === ' ') { e.preventDefault(); if (this.bullets.length < 3) this.bullets.push({ x: this.player.x + this.player.w / 2 - 2, y: H - 70, w: 4, h: 10 }); }
  }

  loop() {
    if (this.over) { this.draw(); return; }
    const now = performance.now(); const dt = now - this.lastTime; this.lastTime = now;
    this.moveTimer += dt; this.shootTimer += dt;
    // Move enemies
    if (this.moveTimer >= this.moveInterval) {
      this.moveTimer = 0;
      let edgeHit = false;
      this.enemies.filter(e => e.alive).forEach(e => { e.x += this.dir * 12; if (e.x <= 5 || e.x + e.w >= W - 5) edgeHit = true; });
      if (edgeHit) { this.dir *= -1; this.enemies.filter(e => e.alive).forEach(e => { e.y += 16; e.x += this.dir * 12; }); }
      // Check if enemies reached bottom
      if (this.enemies.some(e => e.alive && e.y + e.h >= H - 60)) { this.gameOver(); return; }
    }
    // Enemy shoot
    if (this.shootTimer >= Math.max(400, 1200 - this.level * 100)) {
      this.shootTimer = 0;
      const alive = this.enemies.filter(e => e.alive);
      if (alive.length) { const e = alive[Math.floor(Math.random() * alive.length)]; this.enemyBullets.push({ x: e.x + e.w / 2, y: e.y + e.h }); }
    }
    // Move bullets
    this.bullets = this.bullets.filter(b => { b.y -= 6; return b.y > 0; });
    this.enemyBullets = this.enemyBullets.filter(b => { b.y += 4; return b.y < H; });
    // Bullet-enemy collision
    this.bullets = this.bullets.filter(b => {
      for (let e of this.enemies) {
        if (e.alive && b.x < e.x + e.w && b.x + b.w > e.x && b.y < e.y + e.h && b.y + b.h > e.y) {
          e.alive = false; this.score += (3 - e.type) * 10; return false;
        }
      }
      return true;
    });
    // Enemy bullet-player collision
    this.enemyBullets = this.enemyBullets.filter(b => {
      if (b.x > this.player.x && b.x < this.player.x + this.player.w && b.y > H - 70 && b.y < H - 50) {
        this.lives--; if (this.lives <= 0) { this.gameOver(); } return false;
      }
      return true;
    });
    // Level complete
    if (this.enemies.every(e => !e.alive)) { this.level++; this.initLevel(); }
    this.draw();
    this._raf = requestAnimationFrame(() => this.loop());
  }

  gameOver() {
    this.over = true;
    saveHighScore('invaders', this.score, { level: this.level });
    clearGameProgress('invaders');
    this.draw();
  }

  draw() {
    ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, H);
    // Stars
    this.stars.forEach(s => { ctx.fillStyle = `rgba(255,255,255,${s.s / 2})`; ctx.fillRect(s.x, s.y, s.s, s.s); });
    // Enemies
    const colors = [C.green, C.cyan, C.amber];
    this.enemies.filter(e => e.alive).forEach(e => {
      ctx.fillStyle = colors[e.type];
      // Pixel art enemy
      const px = 4;
      if (e.type === 2) { // Top alien
        ctx.fillRect(e.x + 12, e.y, px, px); ctx.fillRect(e.x + 16, e.y, px, px);
        ctx.fillRect(e.x + 8, e.y + 4, px * 3, px);
        ctx.fillRect(e.x + 4, e.y + 8, px * 4, px);
        ctx.fillRect(e.x + 8, e.y + 12, px, px); ctx.fillRect(e.x + 16, e.y + 12, px, px);
      } else if (e.type === 1) { // Middle alien
        ctx.fillRect(e.x + 8, e.y, px * 3, px);
        ctx.fillRect(e.x + 4, e.y + 4, px * 5, px);
        ctx.fillRect(e.x + 4, e.y + 8, px, px); ctx.fillRect(e.x + 12, e.y + 8, px, px); ctx.fillRect(e.x + 20, e.y + 8, px, px);
        ctx.fillRect(e.x + 8, e.y + 12, px, px); ctx.fillRect(e.x + 16, e.y + 12, px, px);
      } else { // Bottom alien
        ctx.fillRect(e.x + 8, e.y, px * 3, px);
        ctx.fillRect(e.x + 4, e.y + 4, px * 5, px);
        ctx.fillRect(e.x + 4, e.y + 8, px * 5, px);
        ctx.fillRect(e.x + 8, e.y + 12, px, px); ctx.fillRect(e.x + 16, e.y + 12, px, px);
      }
    });
    // Player
    ctx.fillStyle = C.green;
    ctx.fillRect(this.player.x, H - 66, this.player.w, this.player.h);
    ctx.fillRect(this.player.x + 12, H - 74, 6, 8);
    // Bullets
    ctx.fillStyle = C.amber;
    this.bullets.forEach(b => ctx.fillRect(b.x, b.y, b.w, b.h));
    ctx.fillStyle = C.red;
    this.enemyBullets.forEach(b => ctx.fillRect(b.x - 2, b.y, 4, 8));
    // HUD
    ctx.fillStyle = C.amber; ctx.font = '12px Consolas, monospace'; ctx.textAlign = 'left';
    ctx.fillText('SCORE ' + this.score, 10, 20);
    ctx.fillStyle = C.cyan; ctx.fillText('LV ' + this.level, 10, 38);
    ctx.fillStyle = C.red; ctx.textAlign = 'right';
    ctx.fillText('♥'.repeat(this.lives), W - 10, 20);
    // Game over
    if (this.over) {
      ctx.fillStyle = 'rgba(0,0,0,0.75)'; ctx.fillRect(0, 0, W, H);
      ctx.textAlign = 'center';
      ctx.fillStyle = C.red; ctx.font = '28px Consolas, monospace';
      ctx.fillText('GAME OVER', W / 2, H / 2 - 40);
      ctx.fillStyle = C.amber; ctx.font = '18px Consolas, monospace';
      ctx.fillText('Score: ' + this.score, W / 2, H / 2 - 10);
      const hi = getHighScore('invaders');
      if (hi > 0) { ctx.fillStyle = C.yellow; ctx.font = '12px Consolas, monospace'; ctx.fillText('BEST: ' + hi, W / 2, H / 2 + 15); }
      ctx.fillStyle = C.dim; ctx.font = '12px Consolas, monospace';
      ctx.fillText('R restart · ESC menu · H scores', W / 2, H / 2 + 45);
    }
  }
}

// ══════════════════════════════════════════════
//  HEXTRIS (Simplified Hexagonal Block Puzzle)
// ══════════════════════════════════════════════
class GameHextris {
  constructor() { this.over = false; }

  init() {
    if (this._keyH) document.removeEventListener('keydown', this._keyH);
    this.score = 0; this.over = false;
    this.hex = { angle: 0, sides: [0, 0, 0, 0, 0, 0] }; // 6 sides, color index
    this.blocks = []; // falling blocks {side, color}
    this.stacked = [[], [], [], [], [], []]; // blocks stacked on each side
    this.spawnTimer = 0; this.spawnInterval = 1200;
    this.colors = [C.red, C.green, C.blue, C.yellow, C.magenta, C.cyan];
    this.lastTime = performance.now();
    this._keyH = (e) => this.key(e);
    document.addEventListener('keydown', this._keyH);
    this.loop();
  }

  saveProgress() { saveGameProgress('hextris', { score: this.score }); }
  destroy() { document.removeEventListener('keydown', this._keyH); if (this._raf) cancelAnimationFrame(this._raf); }

  key(e) {
    if (e.key === 'Escape') { backToMenu(); return; }
    if (this.over && e.key === 'r') { this.init(); return; }
    if (this.over && (e.key === 'h' || e.key === 'H')) { showHighScores('hextris'); return; }
    if (this.over) return;
    if (e.key === 'ArrowLeft') { e.preventDefault(); this.hex.angle = (this.hex.angle + 1) % 6; }
    if (e.key === 'ArrowRight') { e.preventDefault(); this.hex.angle = (this.hex.angle + 5) % 6; }
  }

  spawnBlock() {
    const side = Math.floor(Math.random() * 6);
    const color = Math.floor(Math.random() * this.colors.length);
    this.blocks.push({ side, color, progress: 0 });
  }

  loop() {
    if (this.over) { this.draw(); return; }
    const now = performance.now(); const dt = now - this.lastTime; this.lastTime = now;
    this.spawnTimer += dt;
    if (this.spawnTimer >= this.spawnInterval) {
      this.spawnTimer = 0;
      this.spawnBlock();
      this.spawnInterval = Math.max(400, this.spawnInterval - 20);
    }
    // Move blocks
    this.blocks.forEach(b => { b.progress += dt / 800; });
    // Check collision with hexagon
    this.blocks = this.blocks.filter(b => {
      if (b.progress >= 1) {
        const targetSide = (b.side + this.hex.angle) % 6;
        this.stacked[targetSide].push(b.color);
        // Check match
        if (this.stacked[targetSide].length >= 3) {
          const last3 = this.stacked[targetSide].slice(-3);
          if (last3[0] === last3[1] && last3[1] === last3[2]) {
            this.stacked[targetSide].splice(-3, 3);
            this.score += 100;
          }
        }
        // Check overflow
        if (this.stacked[targetSide].length >= 8) {
          this.over = true;
          saveHighScore('hextris', this.score);
          clearGameProgress('hextris');
        }
        return false;
      }
      return true;
    });
    this.draw();
    this._raf = requestAnimationFrame(() => this.loop());
  }

  draw() {
    ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, H);
    // Title
    ctx.fillStyle = C.green; ctx.font = '24px Consolas, monospace'; ctx.textAlign = 'center';
    ctx.shadowColor = C.green; ctx.shadowBlur = 8;
    ctx.fillText('H E X T R I S', W / 2, 50); ctx.shadowBlur = 0;
    // Score
    ctx.fillStyle = C.amber; ctx.font = '14px Consolas, monospace';
    ctx.fillText('SCORE: ' + this.score, W / 2, 80);
    // Draw hexagon
    const cx = W / 2, cy = H / 2 + 20, r = 80;
    ctx.strokeStyle = C.dim; ctx.lineWidth = 2;
    for (let i = 0; i < 6; i++) {
      const a1 = (i * 60 - 90 + this.hex.angle * 60) * Math.PI / 180;
      const a2 = ((i + 1) * 60 - 90 + this.hex.angle * 60) * Math.PI / 180;
      const x1 = cx + r * Math.cos(a1), y1 = cy + r * Math.sin(a1);
      const x2 = cx + r * Math.cos(a2), y2 = cy + r * Math.sin(a2);
      // Draw stacked blocks on this side
      const stack = this.stacked[i];
      if (stack.length > 0) {
        const dx = (x2 - x1) / stack.length;
        const dy = (y2 - y1) / stack.length;
        stack.forEach((c, j) => {
          ctx.fillStyle = this.colors[c];
          ctx.fillRect(x1 + dx * j - 4, y1 + dy * j - 4, 8, 8);
        });
      }
      ctx.strokeStyle = C.dim;
      ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    }
    // Draw falling blocks
    this.blocks.forEach(b => {
      const a = (b.side * 60 - 90 + this.hex.angle * 60) * Math.PI / 180;
      const x = cx + r * (1 - b.progress) * Math.cos(a);
      const y = cy + r * (1 - b.progress) * Math.sin(a);
      ctx.fillStyle = this.colors[b.color];
      ctx.fillRect(x - 6, y - 6, 12, 12);
    });
    // Controls hint
    ctx.fillStyle = C.dim; ctx.font = '11px Consolas, monospace'; ctx.textAlign = 'center';
    ctx.fillText('← → ROTATE HEXAGON', W / 2, H - 40);
    // Game over
    if (this.over) {
      ctx.fillStyle = 'rgba(0,0,0,0.75)'; ctx.fillRect(0, 0, W, H);
      ctx.textAlign = 'center';
      ctx.fillStyle = C.red; ctx.font = '28px Consolas, monospace';
      ctx.fillText('GAME OVER', W / 2, H / 2 - 40);
      ctx.fillStyle = C.amber; ctx.font = '18px Consolas, monospace';
      ctx.fillText('Score: ' + this.score, W / 2, H / 2 - 10);
      ctx.fillStyle = C.dim; ctx.font = '12px Consolas, monospace';
      ctx.fillText('R restart · ESC menu · H scores', W / 2, H / 2 + 30);
    }
  }
}

// ══════════════════════════════════════════════
//  TOWER STACKING
// ══════════════════════════════════════════════
class GameTower {
  constructor() { this.over = false; }

  init() {
    if (this._keyH) document.removeEventListener('keydown', this._keyH);
    if (this._clickH) canvas.removeEventListener('click', this._clickH);
    this.score = 0; this.over = false; this.blocks = [];
    this.current = { x: 50, w: 160, dir: 1, speed: 2 };
    this.baseY = H - 60;
    this.cameraY = 0;
    this.colors = [C.green, C.cyan, C.amber, C.magenta, C.blue, C.red, C.yellow];
    this.addBlock(W / 2 - 80, 160); // Base block
    this._keyH = (e) => this.key(e);
    document.addEventListener('keydown', this._keyH);
    this._clickH = () => this.place();
    canvas.addEventListener('click', this._clickH);
    this.lastTime = performance.now();
    this.loop();
  }

  addBlock(x, w) { this.blocks.push({ x, w, color: this.colors[this.blocks.length % this.colors.length] }); }

  saveProgress() { saveGameProgress('tower', { score: this.score, blocks: this.blocks }); }
  destroy() {
    document.removeEventListener('keydown', this._keyH);
    canvas.removeEventListener('click', this._clickH);
    if (this._raf) cancelAnimationFrame(this._raf);
  }

  key(e) {
    if (e.key === 'Escape') { backToMenu(); return; }
    if (this.over && e.key === 'r') { this.init(); return; }
    if (this.over && (e.key === 'h' || e.key === 'H')) { showHighScores('tower'); return; }
    if (this.over) return;
    if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); this.place(); }
  }

  place() {
    const top = this.blocks[this.blocks.length - 1];
    const overlap = Math.min(this.current.x + this.current.w, top.x + top.w) - Math.max(this.current.x, top.x);
    if (overlap <= 0) {
      this.over = true;
      saveHighScore('tower', this.score);
      clearGameProgress('tower');
      return;
    }
    const newX = Math.max(this.current.x, top.x);
    this.blocks.push({ x: newX, w: overlap, color: this.colors[this.blocks.length % this.colors.length] });
    this.score++;
    // Camera scroll
    if (this.blocks.length > 8) this.cameraY = (this.blocks.length - 8) * 24;
    // Speed increase
    this.current.speed = Math.min(6, 2 + this.score * 0.2);
    this.current.w = overlap;
    this.current.x = this.current.dir > 0 ? -overlap : W;
    this.draw();
  }

  loop() {
    if (this.over) { this.draw(); return; }
    const now = performance.now(); const dt = now - this.lastTime; this.lastTime = now;
    this.current.x += this.current.dir * this.current.speed * (dt / 16);
    if (this.current.x + this.current.w > W) { this.current.x = W - this.current.w; this.current.dir = -1; }
    if (this.current.x < 0) { this.current.x = 0; this.current.dir = 1; }
    this.draw();
    this._raf = requestAnimationFrame(() => this.loop());
  }

  draw() {
    ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, H);
    // Title
    ctx.fillStyle = C.green; ctx.font = '20px Consolas, monospace'; ctx.textAlign = 'center';
    ctx.shadowColor = C.green; ctx.shadowBlur = 8;
    ctx.fillText('T O W E R', W / 2, 40); ctx.shadowBlur = 0;
    // Score
    ctx.fillStyle = C.amber; ctx.font = '14px Consolas, monospace';
    ctx.fillText('SCORE: ' + this.score, W / 2, 65);
    // Blocks
    const bh = 24;
    this.blocks.forEach((b, i) => {
      const y = this.baseY - i * bh + this.cameraY;
      if (y < -bh || y > H) return;
      ctx.fillStyle = b.color;
      ctx.fillRect(b.x, y, b.w, bh - 2);
      // Pixel highlight
      ctx.fillStyle = 'rgba(255,255,255,0.2)';
      ctx.fillRect(b.x, y, b.w, 3);
    });
    // Current moving block
    if (!this.over) {
      const topIdx = this.blocks.length - 1;
      const y = this.baseY - (topIdx + 1) * bh + this.cameraY;
      ctx.fillStyle = this.colors[this.blocks.length % this.colors.length];
      ctx.fillRect(this.current.x, y, this.current.w, bh - 2);
    }
    // Game over
    if (this.over) {
      ctx.fillStyle = 'rgba(0,0,0,0.75)'; ctx.fillRect(0, 0, W, H);
      ctx.textAlign = 'center';
      ctx.fillStyle = C.red; ctx.font = '28px Consolas, monospace';
      ctx.fillText('GAME OVER', W / 2, H / 2 - 40);
      ctx.fillStyle = C.amber; ctx.font = '18px Consolas, monospace';
      ctx.fillText('Height: ' + this.score, W / 2, H / 2 - 10);
      ctx.fillStyle = C.dim; ctx.font = '12px Consolas, monospace';
      ctx.fillText('R restart · ESC menu · H scores', W / 2, H / 2 + 30);
    }
  }
}

// ══════════════════════════════════════════════
//  PSEUDO-3D RACER
// ══════════════════════════════════════════════
class GameRacer {
  constructor() { this.over = false; }

  init() {
    if (this._keyH) document.removeEventListener('keydown', this._keyH);
    if (this._keyUpH) document.removeEventListener('keyup', this._keyUpH);
    this.score = 0; this.speed = 0; this.maxSpeed = 160; this.over = false;
    this.playerX = 0; // -1 to 1
    this.road = []; this.segments = 200;
    this.cameraDepth = 100; this.cameraHeight = 120;
    this.drawDistance = 120;
    this.roadOffset = 0; // animated road marking offset
    this.stars = Array.from({ length: 50 }, () => ({
      x: Math.random() * W, y: Math.random() * H / 2, s: Math.random() * 2
    }));
    this.roadWidth = 1200;
    // Obstacles (oncoming traffic)
    this.obstacles = [];
    this.obstacleTimer = 0;
    this.obstacleInterval = 60; // frames between spawns
    // Generate road curves
    for (let i = 0; i < this.segments; i++) {
      this.road.push({ curve: Math.sin(i * 0.02) * 3, y: 0 });
    }
    this._keyH = (e) => this.key(e);
    document.addEventListener('keydown', this._keyH);
    this._keyUpH = (e) => { if (e.key === 'ArrowUp' || e.key === 'ArrowDown') this.speed = Math.max(0, this.speed - 2); };
    document.addEventListener('keyup', this._keyUpH);
    this.lastTime = performance.now();
    this.loop();
  }

  saveProgress() { saveGameProgress('racer', { score: this.score, speed: this.speed }); }
  destroy() {
    document.removeEventListener('keydown', this._keyH);
    document.removeEventListener('keyup', this._keyUpH);
    if (this._raf) cancelAnimationFrame(this._raf);
  }

  key(e) {
    if (e.key === 'Escape') { backToMenu(); return; }
    if (this.over && e.key === 'r') { this.destroy(); this.init(); return; }
    if (this.over && (e.key === 'h' || e.key === 'H')) { showHighScores('racer'); return; }
    if (this.over) return;
    if (e.key === 'ArrowUp') { e.preventDefault(); this.speed = Math.min(this.maxSpeed, this.speed + 3); }
    if (e.key === 'ArrowDown') { e.preventDefault(); this.speed = Math.max(0, this.speed - 4); }
    if (e.key === 'ArrowLeft') { e.preventDefault(); this.playerX = Math.max(-1, this.playerX - 0.05); }
    if (e.key === 'ArrowRight') { e.preventDefault(); this.playerX = Math.min(1, this.playerX + 0.05); }
  }

  loop() {
    if (this.over) { this.draw(); return; }
    if (this._raf) cancelAnimationFrame(this._raf);
    const now = performance.now(); const dt = now - this.lastTime; this.lastTime = now;
    this.score += Math.floor(this.speed * dt / 1000);
    // Animated road offset
    this.roadOffset = (this.roadOffset + this.speed * dt / 1000) % 2;
    // Spawn obstacles — further away, avoid player's lane
    if (this.speed > 5) {
      this.obstacleTimer++;
      if (this.obstacleTimer >= this.obstacleInterval) {
        this.obstacleTimer = 0;
        const colors = [C.red, C.amber, C.cyan, C.magenta, C.blue, '#ff6600', '#cc33ff', '#33ccff', '#ffcc00', '#66ff33'];
        // Spawn in a random lane but avoid player's current lane (±0.2 safe zone)
        let lane;
        do { lane = (Math.random() - 0.5) * 1.2; } while (Math.abs(lane - this.playerX) < 0.25);
        // Spawn further ahead — scale with speed so faster = more reaction time
        const spawnDist = 1.8 + Math.min(this.speed / 80, 1.5);
        this.obstacles.push({ x: lane, dist: spawnDist, color: colors[Math.floor(Math.random() * colors.length)] });
      }
    }
    // Move obstacles toward player (they come FROM the front)
    const moveSpeed = this.speed * dt / 1000;
    this.obstacles.forEach(o => { o.dist -= moveSpeed; });
    // Remove obstacles that passed the player
    this.obstacles = this.obstacles.filter(o => o.dist > -0.3);
    // Collision detection — continuous sweep to prevent tunneling at high speed
    for (let i = 0; i < this.obstacles.length; i++) {
      const o = this.obstacles[i];
      if (o.dist > 0.75 && o.dist < 1.0) {
        const oScreenX = W / 2 + o.x * 60;
        const pScreenX = W / 2 + this.playerX * 60;
        if (Math.abs(oScreenX - pScreenX) < 42) {
          this.over = true;
          saveHighScore('racer', this.score, {});
          break;
        }
      }
    }
