<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --glass-bg:rgba(255,255,255,0.18);
  --glass-bg-hover:rgba(0,0,0,0.03);
  --glass-border:rgba(255,255,255,0.25);
  --glass-inner:rgba(255,255,255,0.12);
  --text-primary:#0f172a;
  --text-secondary:#475569;
  --text-tertiary:#94a3b8;
  --accent:#007AFF;
  --accent-soft:rgba(0,122,255,0.08);
  --done-bg:rgba(0,0,0,0.05);
  --done-border:rgba(0,0,0,0.12);
  --high:#d97706;
  --urgent:#dc2626;
  --low:#94a3b8;
  --divider:rgba(0,0,0,0.06);
  --shadow:0 8px 40px rgba(0,0,0,0.12),0 0 0 0.5px rgba(255,255,255,0.25);
  --radius:20px;
  --radius-sm:12px;
}
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap');
body{
  background:transparent;overflow:hidden;user-select:none;
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'SF Pro Display','Helvetica Neue',system-ui,sans-serif;
  height:100vh;display:flex;align-items:center;justify-content:center;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
}
.wrap{
  width:100%;height:100%;display:flex;flex-direction:column;
  background:var(--glass-bg);
  backdrop-filter:blur(40px) saturate(1.8);
  -webkit-backdrop-filter:blur(40px) saturate(1.8);
  border:0.5px solid var(--glass-border);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  overflow:hidden;
}

/* ── 拖拽区域 ── */
.drag-zone{
  padding:14px 18px 12px;cursor:move;
  display:flex;align-items:baseline;gap:14px;
  border-bottom:0.5px solid var(--divider);
  position:relative;
  background:linear-gradient(180deg,rgba(0,0,0,0.015) 0%,transparent 100%);
}
.drag-zone::before{
  content:'';position:absolute;top:6px;left:50%;transform:translateX(-50%);
  width:34px;height:4px;border-radius:2px;background:rgba(0,0,0,0.08);
}
.time{
  font-size:32px;font-weight:300;color:var(--text-primary);
  letter-spacing:1px;font-variant-numeric:tabular-nums;line-height:1;
  font-feature-settings:'tnum';
}
.time-colon{opacity:0.25;animation:blink 2s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:.25}50%{opacity:.7}}
.date-group{display:flex;flex-direction:column;gap:1px}
.date{font-size:12px;color:var(--text-secondary);font-weight:400;letter-spacing:0.2px}
.weekday{font-size:10px;color:var(--accent);font-weight:600;letter-spacing:0.5px}

/* ── 任务列表 ── */
.list{flex:1;overflow-y:auto;padding:6px 10px}
.list::-webkit-scrollbar{width:3px}
.list::-webkit-scrollbar-thumb{background:rgba(0,0,0,0.08);border-radius:2px}
.list::-webkit-scrollbar-track{background:transparent}

.section-label{
  font-size:10px;font-weight:600;letter-spacing:0.4px;
  color:var(--text-tertiary);padding:8px 8px 4px;
  display:flex;align-items:center;gap:6px;
  text-transform:uppercase;font-feature-settings:'smcp';
}
.section-dot{width:4px;height:4px;border-radius:50%;background:rgba(0,0,0,0.1)}

.task-item{
  display:flex;align-items:flex-start;gap:8px;
  padding:8px 10px;border-radius:var(--radius-sm);
  transition:background .2s cubic-bezier(.25,.1,.25,1);cursor:pointer;
  border:0.5px solid transparent;margin-bottom:1px;
}
.task-item:hover{
  background:var(--glass-bg-hover);
  border-color:rgba(0,0,0,0.04);
}
.task-item:active{
  transform:scale(0.985);
  background:rgba(0,0,0,0.04);
}

.check{
  width:18px;height:18px;border-radius:50%;
  border:1.5px solid rgba(0,0,0,0.12);background:transparent;
  flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;
  transition:all .3s cubic-bezier(.4,0,.2,1);
}
.check.done{
  background:var(--done-bg);border-color:var(--done-border);
}
.check.done::after{content:'✓';font-size:10px;color:var(--text-secondary);font-weight:600}

.task-body{flex:1;min-width:0}
.task-text{
  font-size:12.5px;color:var(--text-primary);line-height:1.5;
  word-break:break-word;font-weight:400;letter-spacing:-0.05px;
}
.task-text.done{color:var(--text-tertiary);text-decoration:line-through;text-decoration-color:rgba(0,0,0,0.08)}

.task-row{display:flex;align-items:center;gap:5px;margin-top:3px;flex-wrap:wrap}
.task-meta{font-size:10px;color:var(--text-tertiary);font-variant-numeric:tabular-nums}

.priority-bar{
  width:3px;height:100%;border-radius:2px;flex-shrink:0;min-height:16px;
}
.p-high{background:var(--high)}
.p-urgent{background:var(--urgent)}
.p-normal{background:rgba(0,0,0,0.1)}
.p-low{background:var(--low)}

.main-tag{
  font-size:9px;font-weight:600;letter-spacing:0.2px;
  color:var(--text-secondary);background:rgba(0,0,0,0.04);
  padding:1px 6px;border-radius:5px;
}

.empty{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:32px 16px;gap:6px;
}
.empty-icon{
  width:36px;height:36px;border-radius:50%;
  background:rgba(0,0,0,0.03);display:flex;align-items:center;justify-content:center;
}
.empty-icon svg{width:18px;height:18px;color:var(--text-tertiary)}
.empty-text{font-size:12px;color:var(--text-tertiary);letter-spacing:0.2px}

/* ── 底部统计 ── */
.footer{
  padding:8px 18px;border-top:0.5px solid var(--divider);
  display:flex;justify-content:space-between;align-items:center;
  background:linear-gradient(0deg,rgba(0,0,0,0.01) 0%,transparent 100%);
}
.stat{font-size:10px;color:var(--text-tertiary);font-variant-numeric:tabular-nums}
.stat-bar{
  width:48px;height:3px;border-radius:2px;background:rgba(0,0,0,0.05);
  overflow:hidden;margin-left:6px;
}
.stat-fill{height:100%;border-radius:2px;background:rgba(0,0,0,0.15);transition:width .5s cubic-bezier(.4,0,.2,1)}

/* ── 关闭按钮 ── */
.close-btn{
  position:absolute;top:10px;right:12px;
  width:20px;height:20px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;z-index:10;transition:all .15s;
  background:rgba(0,0,0,0.03);
}
.close-btn svg{width:10px;height:10px;color:var(--text-tertiary);transition:color .15s}
.close-btn:hover{background:rgba(220,60,60,0.08)}
.close-btn:hover svg{color:rgba(220,60,60,0.8)}
</style>
</head>
<body>
<div class="wrap" style="position:relative">
  <span class="close-btn" id="closeBtn">
    <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M3 3l6 6M9 3l-6 6"/></svg>
  </span>

  <div class="drag-zone" id="dragZone">
    <span class="time"><span id="h">00</span><span class="time-colon">:</span><span id="m">00</span></span>
    <div class="date-group">
      <span class="date" id="dateStr"></span>
      <span class="weekday" id="weekStr"></span>
    </div>
  </div>

  <div class="list" id="taskList"></div>

  <div class="footer">
    <div style="display:flex;align-items:center">
      <span class="stat" id="statTotal">共 0 项</span>
      <div class="stat-bar"><div class="stat-fill" id="statFill" style="width:0%"></div></div>
    </div>
    <span class="stat" id="statDone">已完成 0</span>
  </div>
</div>

<script>
function callRust(cmd, args) {
  if (typeof window.invoke === 'function') return window.invoke(cmd, args || {});
  if (window.__TAURI_INTERNALS__ && window.__TAURI_INTERNALS__.invoke)
    return window.__TAURI_INTERNALS__.invoke(cmd, args || {});
  return Promise.reject('no IPC');
}

var API = 'http://127.0.0.1:8765';
var today = new Date().toISOString().split('T')[0];
var weekdays = ['周日','周一','周二','周三','周四','周五','周六'];

function pad2(n){return String(n).padStart(2,'0')}

function updateClock(){
  var now = new Date();
  document.getElementById('h').textContent = pad2(now.getHours());
  document.getElementById('m').textContent = pad2(now.getMinutes());
  document.getElementById('dateStr').textContent = now.getFullYear()+'.'+pad2(now.getMonth()+1)+'.'+pad2(now.getDate());
  document.getElementById('weekStr').textContent = weekdays[now.getDay()];
}
setInterval(updateClock, 1000);
updateClock();

function loadTasks(){
  Promise.all([
    fetch(API+'/api/tasks?date='+today).then(function(r){return r.json()}).catch(function(){return []}),
    fetch(API+'/api/tasks/main').then(function(r){return r.json()}).catch(function(){return []}),
    fetch(API+'/api/tasks/incomplete').then(function(r){return r.json()}).catch(function(){return []})
  ]).then(function(results){
    var todayTasks = results[0] || [];
    var mainTasks = results[1] || [];
    var incomplete = results[2] || [];
    var ids = new Set();
    var all = [];
    mainTasks.forEach(function(t){if(!ids.has(t.id)){ids.add(t.id);all.push(t)}});
    todayTasks.forEach(function(t){if(!ids.has(t.id)&&t.category!=='main'){ids.add(t.id);all.push(t)}});
    incomplete.forEach(function(t){if(!ids.has(t.id)){ids.add(t.id);all.push(t)}});
    renderTasks(all);
  });
}

function renderTasks(tasks){
  var list = document.getElementById('taskList');
  if(!tasks.length){
    list.innerHTML='<div class="empty"><div class="empty-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 12l2 2 4-4"/><circle cx="12" cy="12" r="10"/></svg></div><span class="empty-text">暂无待办事项</span></div>';
    updateStats(0,0);return;
  }
  var mainTasks = tasks.filter(function(t){return t.category==='main'&&!t.completed});
  var otherTasks = tasks.filter(function(t){return t.category!=='main'});
  var html = '';
  if(mainTasks.length){
    html += '<div class="section-label"><span class="section-dot" style="background:rgba(0,0,0,0.08)"></span>主线任务</div>';
    mainTasks.forEach(function(t){html += renderTask(t)});
  }
  if(otherTasks.length){
    if(mainTasks.length) html += '<div style="height:2px"></div>';
    html += '<div class="section-label"><span class="section-dot"></span>待办事项</div>';
    otherTasks.forEach(function(t){html += renderTask(t)});
  }
  list.innerHTML = html;
  var done = tasks.filter(function(t){return t.completed}).length;
  updateStats(tasks.length, done);
  list.querySelectorAll('.task-item').forEach(function(el){
    el.addEventListener('click',function(){
      fetch(API+'/api/tasks/'+el.dataset.id+'/toggle',{method:'POST'}).then(function(){loadTasks()});
    });
  });
}

function renderTask(t){
  var isToday = t.date === today;
  var showDate = !isToday && !t.completed;
  var prio = t.priority || 'normal';
  return '<div class="task-item" data-id="'+t.id+'">'
    + '<div class="priority-bar p-'+prio+'"></div>'
    + '<div class="check'+(t.completed?' done':'')+'"></div>'
    + '<div class="task-body">'
    + '<span class="task-text'+(t.completed?' done':'')+'">'+escapeHtml(t.content)+'</span>'
    + '<div class="task-row">'
    + (t.category==='main'?'<span class="main-tag">主线</span>':'')
    + (showDate?'<span class="task-meta">'+t.date+'</span>':'')
    + '</div></div></div>';
}

function escapeHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

function updateStats(total, done){
  document.getElementById('statTotal').textContent = '共 '+total+' 项';
  document.getElementById('statDone').textContent = '已完成 '+done;
  document.getElementById('statFill').style.width = total>0?Math.round(done/total*100)+'%':'0%';
}

document.getElementById('dragZone').addEventListener('mousedown',function(e){
  if(e.button!==0)return;
  if(e.target.closest('.close-btn'))return;
  callRust('plugin:window|start_dragging',{}).catch(function(){});
});

document.getElementById('closeBtn').addEventListener('click',function(){
  callRust('close_todo_window',{}).catch(function(){});
});

loadTasks();
setInterval(loadTasks, 30000);
</script>
</body>
</html>
