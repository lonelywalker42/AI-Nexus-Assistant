<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:rgba(15,23,42,0.88);
  --card:rgba(30,41,59,0.5);
  --card-hover:rgba(51,65,85,0.4);
  --border:rgba(71,85,105,0.3);
  --border-light:rgba(148,163,184,0.08);
  --text:#f1f5f9;--text2:#94a3b8;--text3:#64748b;
  --accent:#60a5fa;--green:#34d399;--amber:#fbbf24;--red:#f87171;--purple:#a78bfa;
  --glow-accent:rgba(96,165,250,0.12);
  --glow-green:rgba(52,211,153,0.12);
}
body{
  background:transparent;overflow:hidden;user-select:none;
  font-family:'Inter','Open Sans',system-ui,-apple-system,sans-serif;
  height:100vh;display:flex;align-items:center;justify-content:center;
  -webkit-font-smoothing:antialiased;
}
.wrap{
  width:100%;height:100%;display:flex;flex-direction:column;
  background:var(--bg);
  backdrop-filter:blur(24px) saturate(1.2);-webkit-backdrop-filter:blur(24px) saturate(1.2);
  border:1px solid rgba(148,163,184,0.06);
}

/* ── 拖拽区域 ── */
.drag-zone{
  padding:14px 18px 10px;cursor:move;
  display:flex;align-items:baseline;gap:14px;
  border-bottom:1px solid var(--border);
  position:relative;
}
.drag-zone::before{
  content:'';position:absolute;top:6px;left:50%;transform:translateX(-50%);
  width:32px;height:3px;border-radius:2px;background:rgba(148,163,184,0.2);
}

.time{
  font-size:36px;font-weight:300;color:var(--text);
  letter-spacing:2px;font-variant-numeric:tabular-nums;line-height:1;
}
.time-colon{opacity:0.4;animation:blink 2s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:.4}50%{opacity:1}}
.date-group{display:flex;flex-direction:column;gap:2px}
.date{font-size:13px;color:var(--text2);font-weight:400;letter-spacing:0.5px}
.weekday{font-size:11px;color:var(--accent);font-weight:600;letter-spacing:1px;text-transform:uppercase}

/* ── 任务列表 ── */
.list{flex:1;overflow-y:auto;padding:6px 10px}
.list::-webkit-scrollbar{width:4px}
.list::-webkit-scrollbar-thumb{background:rgba(148,163,184,0.15);border-radius:2px}

.section-label{
  font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;
  color:var(--text3);padding:10px 10px 6px;display:flex;align-items:center;gap:6px;
}
.section-dot{width:5px;height:5px;border-radius:50%;background:var(--accent)}

.task-item{
  display:flex;align-items:flex-start;gap:10px;
  padding:10px 12px;border-radius:12px;
  transition:background .2s ease;cursor:pointer;
  border:1px solid transparent;
}
.task-item:hover{
  background:var(--card-hover);
  border-color:var(--border-light);
}

.check{
  width:18px;height:18px;border-radius:6px;
  border:1.5px solid var(--border);background:transparent;
  flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;
  transition:all .25s cubic-bezier(.4,0,.2,1);
}
.check.done{
  background:var(--green);border-color:var(--green);
  box-shadow:0 0 8px rgba(52,211,153,0.3);
}
.check.done::after{content:'✓';font-size:11px;color:#fff;font-weight:700}

.task-body{flex:1;min-width:0}
.task-text{
  font-size:13px;color:var(--text);line-height:1.6;
  word-break:break-word;font-weight:400;
}
.task-text.done{color:var(--text3);text-decoration:line-through;text-decoration-color:var(--border)}

.task-row{display:flex;align-items:center;gap:6px;margin-top:4px}
.task-meta{font-size:10px;color:var(--text3);font-variant-numeric:tabular-nums}

.priority-bar{
  width:3px;height:100%;border-radius:2px;flex-shrink:0;min-height:18px;
}
.p-high{background:var(--amber)}
.p-urgent{background:var(--red);box-shadow:0 0 6px rgba(248,113,113,0.3)}
.p-normal{background:var(--accent)}
.p-low{background:var(--text3)}

.main-tag{
  font-size:9px;font-weight:700;letter-spacing:0.5px;
  color:var(--purple);background:rgba(167,139,250,0.12);
  padding:2px 7px;border-radius:5px;
}

.empty{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:40px 20px;gap:8px;
}
.empty-icon{font-size:28px;opacity:0.3}
.empty-text{font-size:12px;color:var(--text3);letter-spacing:0.5px}

/* ── 底部统计 ── */
.footer{
  padding:10px 18px;border-top:1px solid var(--border);
  display:flex;justify-content:space-between;align-items:center;
}
.stat{font-size:11px;color:var(--text3);font-variant-numeric:tabular-nums}
.stat-bar{
  width:48px;height:3px;border-radius:2px;background:var(--border);
  overflow:hidden;margin-left:8px;
}
.stat-fill{height:100%;border-radius:2px;background:var(--green);transition:width .5s ease}

/* ── 关闭按钮 ── */
.close-btn{
  position:absolute;top:10px;right:14px;
  width:20px;height:20px;border-radius:6px;
  display:flex;align-items:center;justify-content:center;
  font-size:11px;color:var(--text3);cursor:pointer;z-index:10;
  transition:all .15s;
}
.close-btn:hover{background:rgba(248,113,113,0.15);color:var(--red)}
</style>
</head>
<body>
<div class="wrap" style="position:relative">
  <span class="close-btn" id="closeBtn">✕</span>

  <!-- 拖拽区域 -->
  <div class="drag-zone" id="dragZone">
    <span class="time"><span id="h">00</span><span class="time-colon">:</span><span id="m">00</span></span>
    <div class="date-group">
      <span class="date" id="dateStr"></span>
      <span class="weekday" id="weekStr"></span>
    </div>
  </div>

  <div class="list" id="taskList"></div>

  <div class="footer">
    <div style="display:flex;align-items:center">
      <span class="stat" id="statTotal">共 0 项</span>
      <div class="stat-bar"><div class="stat-fill" id="statFill" style="width:0%"></div></div>
    </div>
    <span class="stat" id="statDone">已完成 0</span>
  </div>
</div>

<script>
function callRust(cmd, args) {
  if (typeof window.invoke === 'function') return window.invoke(cmd, args || {});
  if (window.__TAURI_INTERNALS__ && window.__TAURI_INTERNALS__.invoke)
    return window.__TAURI_INTERNALS__.invoke(cmd, args || {});
  return Promise.reject('no IPC');
}

var API = 'http://127.0.0.1:8765';
var today = new Date().toISOString().split('T')[0];
var weekdays = ['周日','周一','周二','周三','周四','周五','周六'];

function pad2(n){return String(n).padStart(2,'0')}

// 时钟更新
function updateClock(){
  var now = new Date();
  document.getElementById('h').textContent = pad2(now.getHours());
  document.getElementById('m').textContent = pad2(now.getMinutes());
  document.getElementById('dateStr').textContent = now.getFullYear()+'.'+pad2(now.getMonth()+1)+'.'+pad2(now.getDate());
  document.getElementById('weekStr').textContent = weekdays[now.getDay()];
}
setInterval(updateClock, 1000);
updateClock();

// 加载任务
function loadTasks(){
  Promise.all([
    fetch(API+'/api/tasks?date='+today).then(function(r){return r.json()}).catch(function(){return []}),
    fetch(API+'/api/tasks/main').then(function(r){return r.json()}).catch(function(){return []}),
    fetch(API+'/api/tasks/incomplete').then(function(r){return r.json()}).catch(function(){return []})
  ]).then(function(results){
    var todayTasks = results[0] || [];
    var mainTasks = results[1] || [];
    var incomplete = results[2] || [];
    var ids = new Set();
    var all = [];
    mainTasks.forEach(function(t){if(!ids.has(t.id)){ids.add(t.id);all.push(t)}});
    todayTasks.forEach(function(t){if(!ids.has(t.id)&&t.category!=='main'){ids.add(t.id);all.push(t)}});
    incomplete.forEach(function(t){if(!ids.has(t.id)){ids.add(t.id);all.push(t)}});
    renderTasks(all);
  });
}

function renderTasks(tasks){
  var list = document.getElementById('taskList');
  if(!tasks.length){
    list.innerHTML='<div class="empty"><span class="empty-icon">✓</span><span class="empty-text">暂无待办事项</span></div>';
    updateStats(0,0);return;
  }
  var mainTasks = tasks.filter(function(t){return t.category==='main'&&!t.completed});
  var otherTasks = tasks.filter(function(t){return t.category!=='main'});
  var html = '';
  if(mainTasks.length){
    html += '<div class="section-label"><span class="section-dot" style="background:var(--purple)"></span>主线任务</div>';
    mainTasks.forEach(function(t){html += renderTask(t)});
  }
  if(otherTasks.length){
    if(mainTasks.length) html += '<div style="height:4px"></div>';
    html += '<div class="section-label"><span class="section-dot"></span>待办事项</div>';
    otherTasks.forEach(function(t){html += renderTask(t)});
  }
  list.innerHTML = html;
  var done = tasks.filter(function(t){return t.completed}).length;
  updateStats(tasks.length, done);
  list.querySelectorAll('.task-item').forEach(function(el){
    el.addEventListener('click',function(){
      fetch(API+'/api/tasks/'+el.dataset.id+'/toggle',{method:'POST'}).then(function(){loadTasks()});
    });
  });
}

function renderTask(t){
  var isToday = t.date === today;
  var showDate = !isToday && !t.completed;
  var prio = t.priority || 'normal';
  return '<div class="task-item" data-id="'+t.id+'">'
    + '<div class="priority-bar p-'+prio+'"></div>'
    + '<div class="check'+(t.completed?' done':'')+'"></div>'
    + '<div class="task-body">'
    + '<span class="task-text'+(t.completed?' done':'')+'">'+escapeHtml(t.content)+'</span>'
    + '<div class="task-row">'
    + (t.category==='main'?'<span class="main-tag">主线</span>':'')
    + (showDate?'<span class="task-meta">'+t.date+'</span>':'')
    + '</div></div></div>';
}

function escapeHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

function updateStats(total, done){
  document.getElementById('statTotal').textContent = '共 '+total+' 项';
  document.getElementById('statDone').textContent = '已完成 '+done;
  document.getElementById('statFill').style.width = total>0?Math.round(done/total*100)+'%':'0%';
}

// 拖拽
document.getElementById('dragZone').addEventListener('mousedown',function(e){
  if(e.button!==0)return;
  if(e.target.closest('.close-btn'))return;
  callRust('plugin:window|start_dragging',{}).catch(function(){});
});

// 关闭
document.getElementById('closeBtn').addEventListener('click',function(){
  callRust('close_todo_window',{}).catch(function(){});
});

loadTasks();
setInterval(loadTasks, 30000);
</script>
</body>
</html>
