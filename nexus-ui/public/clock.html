<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#010102;--tube:#0e0e12;--tube-b:#22222a;--base:#1a1a20;--metal:#303038;
  --core:#ffe8aa;--hot:#ffcc66;--wire:#ff8c00;--glow:#cc5500;--halo:#7a3a08;
  --off:#18181e;--off-l:#222228;--led:#cc6600;
}
body{
  background:var(--bg);overflow:hidden;user-select:none;
  font-family:Consolas,'Courier New',monospace;
  display:flex;align-items:center;justify-content:center;height:100vh;
}
body.transparent{background:transparent}
body.transparent .tube{
  background:rgba(14,14,18,0.55);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-color:rgba(34,34,42,0.3);box-shadow:inset 0 0 20px rgba(0,0,0,0.4),0 0 20px rgba(122,58,8,0.12);
}
body.transparent .led{
  background:rgba(6,6,8,0.45);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border-color:rgba(18,18,26,0.2);
}
body.transparent .col .cd{box-shadow:0 0 8px var(--hot),0 0 16px var(--wire),0 0 24px var(--glow)}
body.transparent .tube::after{background:rgba(26,26,32,0.4);border-color:rgba(48,48,56,0.3)}

.wrap{display:flex;flex-direction:column;align-items:center;gap:6px}
.row{display:flex;align-items:center;gap:2px;position:relative;cursor:move}
.tube{
  width:38px;height:72px;background:var(--tube);border:1px solid var(--tube-b);
  border-radius:8px 8px 4px 4px;display:flex;align-items:center;justify-content:center;
  position:relative;box-shadow:inset 0 0 15px rgba(0,0,0,.8),0 1px 0 #3a3a44;
  transition:background .3s,box-shadow .3s;
}
.tube::before{
  content:'';position:absolute;top:8px;bottom:8px;left:3px;right:3px;
  background:repeating-linear-gradient(0deg,transparent,transparent 8px,rgba(26,26,32,.3) 8px,rgba(26,26,32,.3) 9px);
  border-radius:4px;pointer-events:none;
}
.tube::after{
  content:'';position:absolute;bottom:-4px;left:4px;right:4px;height:6px;
  background:var(--base);border:1px solid var(--metal);border-radius:0 0 3px 3px;transition:background .3s;
}
.dg{
  font-size:48px;font-weight:700;font-family:Consolas,monospace;line-height:1;z-index:2;
  color:var(--core);text-shadow:0 0 3px var(--hot),0 0 6px var(--wire),0 0 12px var(--glow),0 0 20px var(--glow),0 0 30px var(--halo);
}
.dg.off{color:var(--off);text-shadow:0 0 2px var(--off-l)}
.dg.flash{animation:gf .5s ease-in-out infinite}
.dg.expire{color:#ef4444;text-shadow:0 0 3px #f87171,0 0 8px #ef4444,0 0 15px #dc2626,0 0 25px #b91c1c;animation:gf .4s infinite}
@keyframes gf{0%,100%{opacity:1}50%{opacity:.15}}
.col{display:flex;flex-direction:column;gap:16px;align-items:center;padding:0 4px;z-index:2}
.cd{
  width:8px;height:8px;border-radius:50%;background:var(--wire);
  box-shadow:0 0 4px var(--hot),0 0 8px var(--wire),0 0 14px var(--glow),0 0 20px var(--halo);
  transition:all .3s;
}
.cd.off{background:var(--off);box-shadow:0 0 2px var(--off-l)}
.led{
  width:100%;background:#060608;border:1px solid #12121a;border-radius:4px;padding:5px 8px;
  box-shadow:inset 0 0 8px rgba(0,0,0,.9);transition:background .3s;
}
.led-t{
  font-family:Consolas,monospace;font-size:14px;font-weight:600;letter-spacing:2px;
  color:var(--led);text-shadow:0 0 8px rgba(204,102,0,.6);white-space:nowrap;text-align:center;
}
.cd-lbl{
  font-size:9px;color:var(--glow);text-shadow:0 0 4px rgba(204,85,0,.5);
  letter-spacing:2px;text-transform:uppercase;height:12px;text-align:center;
}
.cd-lbl.exp{color:#ef4444;text-shadow:0 0 4px rgba(239,68,68,.5);animation:gf .5s infinite}
.xbtn{position:absolute;top:6px;right:10px;font-size:10px;color:#3a3a44;cursor:pointer;z-index:10}
.xbtn:hover{color:#ef4444}
</style>
</head>
<body>

<div class="wrap">
  <div class="cd-lbl" id="cdL">&nbsp;</div>
  <div class="row" id="dragZone">
    <div class="tube"><span class="dg" id="h1">0</span></div>
    <div class="tube"><span class="dg" id="h2">0</span></div>
    <div class="col"><div class="cd" id="c1"></div><div class="cd" id="c2"></div></div>
    <div class="tube"><span class="dg" id="m1">0</span></div>
    <div class="tube"><span class="dg" id="m2">0</span></div>
    <div class="col"><div class="cd" id="c3"></div><div class="cd" id="c4"></div></div>
    <div class="tube"><span class="dg" id="s1">0</span></div>
    <div class="tube"><span class="dg" id="s2">0</span></div>
    <span class="xbtn" id="xB">✕</span>
  </div>
  <div class="led"><div class="led-t" id="ld"></div></div>
</div>

<script>
// ── 状态（由 Rust eval 注入到 window._xxx） ──
window._isCD = false;
window._cdTarget = 0;
window._cdDone = false;
window._trans = false;

function $(id){return document.getElementById(id)}
var D={h1:$('h1'),h2:$('h2'),m1:$('m1'),m2:$('m2'),s1:$('s1'),s2:$('s2')};
var C=[$('c1'),$('c2'),$('c3'),$('c4')];
var blink=true;

function p2(n){return String(n).padStart(2,'0')}
function show(h,m,s,cls){
  var t=p2(h)+p2(m)+p2(s),k=['h1','h2','m1','m2','s1','s2'];
  for(var i=0;i<6;i++){D[k[i]].textContent=t[i];D[k[i]].className='dg'+(cls?' '+cls:'')}
}
function showDate(){
  var n=new Date(),w=['SUN','MON','TUE','WED','THU','FRI','SAT'];
  $('ld').textContent=n.getFullYear()+'.'+p2(n.getMonth()+1)+'.'+p2(n.getDate())+'  '+w[n.getDay()]+'  '+(n.getHours()<12?'AM':'PM');
}

function tick(){
  blink=!blink;
  for(var i=0;i<C.length;i++)C[i].classList.toggle('off',!blink);
  if(window._isCD){
    var r=Math.max(0,Math.ceil((window._cdTarget-Date.now())/1000));
    if(r<=0){
      if(!window._cdDone){window._cdDone=true;$('cdL').textContent='TIME UP!';$('cdL').className='cd-lbl exp'}
      show(99,99,99,'expire');return;
    }
    show(Math.floor(r/3600),Math.floor((r%3600)/60),r%60,r<=10?'flash':'');
    $('cdL').textContent='COUNTDOWN';$('cdL').className='cd-lbl'+(r<=10?' exp':'');
  }else{
    var n=new Date();show(n.getHours(),n.getMinutes(),n.getSeconds(),'');
    showDate();$('cdL').innerHTML='&nbsp;';$('cdL').className='cd-lbl';
  }
}
setInterval(tick,500);tick();

// 右键 → 调用 Rust 原生菜单
document.addEventListener('contextmenu',function(e){
  e.preventDefault();
  if(window.invoke) window.invoke('show_context_menu',{hasCd:!!window._isCD,isTrans:!!window._trans}).catch(function(){});
});

// 双击返回主窗口
document.addEventListener('dblclick',function(e){
  if(e.target.closest('.xbtn'))return;
  if(window.invoke) window.invoke('show_main_window',{}).catch(function(){});
});

// 关闭按钮
$('xB').addEventListener('click',function(e){
  e.stopPropagation();
  if(window.invoke) window.invoke('close_clock_window',{}).catch(function(){});
});

// 拖拽
$('dragZone').addEventListener('mousedown',function(e){
  if(e.button!==0||e.target.closest('.xbtn'))return;
  if(typeof window.startDrag==='function') window.startDrag();
});

// ── 滚轮缩放 ──
var CW=360, CH=140, SCALE=1;
document.addEventListener('wheel',function(e){
  e.preventDefault();
  var step = e.deltaY < 0 ? 0.1 : -0.1;
  SCALE = Math.max(0.6, Math.min(2.5, SCALE + step));
  CW = Math.round(360 * SCALE);
  CH = Math.round(140 * SCALE);
  // 缩放所有元素
  var s = SCALE;
  document.querySelectorAll('.tube').forEach(function(t){t.style.width=(38*s)+'px';t.style.height=(72*s)+'px'});
  document.querySelectorAll('.dg').forEach(function(d){d.style.fontSize=(48*s)+'px'});
  document.querySelectorAll('.cd').forEach(function(c){c.style.width=(8*s)+'px';c.style.height=(8*s)+'px'});
  document.querySelectorAll('.col').forEach(function(c){c.style.gap=(16*s)+'px'});
  document.querySelector('.led-t').style.fontSize=(14*s)+'px';
  // 调整窗口大小
  if(window.invoke)window.invoke('resize_clock',{width:CW,height:CH}).catch(function(){});
},{passive:false});

</script>
</body>
</html>
